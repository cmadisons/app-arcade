<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slide Studio</title>
<style>
:root{--bg:#f1f3f4;--panel:#fff;--line:#dadce0;--text:#202124;--muted:#5f6368;--accent:#f4a100;--sel:#1a73e8;--tool:#edf2fa}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);background:var(--bg)}
body{display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:8px;padding:8px 14px 4px;background:var(--panel)}
.logo{width:36px;height:36px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:20px;flex:none}
.titlebox{display:flex;flex-direction:column}
#deckTitle{font-size:18px;border:1px solid transparent;border-radius:4px;padding:2px 6px;min-width:220px;font-family:inherit;color:var(--text);background:transparent}
#deckTitle:hover,#deckTitle:focus{border-color:var(--line);outline:none}
.menus{display:flex;gap:0}
.menus .btn{padding:3px 8px;font-size:14px}
button,select,input{font:inherit;font-size:13px;color:var(--text)}
.btn{border:0;background:transparent;padding:6px 9px;border-radius:5px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;position:relative;white-space:nowrap}
.btn:hover:not(:disabled){background:#dfe3eb}
.btn:disabled{opacity:.35;cursor:default}
.btn.on{background:#d3e3fd;color:#0b57d0}
.present{margin-left:auto;background:var(--accent);color:#fff;font-weight:700;border-radius:22px;padding:9px 20px;font-size:14px}
.present:hover{background:#e29500!important}
.share{background:var(--sel);color:#fff;font-weight:700;border-radius:22px;padding:9px 18px;font-size:14px}
.share:hover{background:#1557b0!important}
.mw .shf{display:grid;gap:6px;font-size:13px;color:var(--muted)}
.mw .shf input,.mw .shf textarea{font:inherit;font-size:15px;color:var(--text);padding:9px 12px;border:1px solid var(--line);border-radius:8px;outline:none}
.mw .shf textarea{height:80px;resize:vertical}
.mw .shf input:focus,.mw .shf textarea:focus{border-color:var(--sel)}
.mw .shf .bad{border-color:#d93025}
.mw .shtip{margin-top:10px;font-size:13px;line-height:1.45;background:#e8f0fe;border-radius:8px;padding:9px 12px;color:#174ea6}
.toolbar{display:flex;align-items:center;gap:2px;flex-wrap:wrap;padding:4px 10px;background:var(--tool);margin:4px 10px 0;border-radius:22px}
.sep{width:1px;height:22px;background:#c4c7c5;margin:0 5px}
.toolbar select{border:0;background:transparent;padding:5px;border-radius:5px;cursor:pointer;max-width:130px}
.toolbar select:hover{background:#dfe3eb}
#fontSize{width:44px;text-align:center;border:1px solid #c4c7c5;border-radius:4px;padding:3px;background:#fff}
.colorbtn{flex-direction:column;gap:0;padding:3px 8px;line-height:1}
.colorbtn .bar{width:18px;height:4px;border-radius:2px;margin-top:2px;border:1px solid #0002}
.colorbtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
main{flex:1;display:flex;min-height:0}
#sidebar{width:210px;overflow-y:auto;padding:12px 10px 20px 4px;flex:none}
.thumb{display:flex;gap:6px;margin-bottom:12px;cursor:pointer}
.thumb .num{width:18px;font-size:12px;color:var(--muted);text-align:right;padding-top:4px;flex:none}
.thumb .mini{flex:1;aspect-ratio:16/9;border:2px solid var(--line);border-radius:7px;overflow:hidden;position:relative;background:#fff;pointer-events:none}
.thumb:hover .mini{border-color:#9aa0a6}
.thumb.active .mini{border-color:var(--accent);box-shadow:0 0 0 2px #f4a10055}
#sidebar.focus .thumb.active .mini{border-color:var(--sel);box-shadow:0 0 0 2px #1a73e855}
.thumb.over .mini{border-color:var(--sel);border-style:dashed}
.addslide{width:calc(100% - 24px);margin-left:24px;border:2px dashed #bdc1c6;border-radius:7px;background:transparent;padding:10px;cursor:pointer;color:var(--muted)}
.addslide:hover{background:#fff;border-color:var(--accent);color:var(--text)}
#work{flex:1;display:flex;flex-direction:column;min-width:0;padding:0 12px 10px 4px}
#wrap{flex:1;position:relative;overflow:hidden;min-height:200px}
.slide{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0;overflow:hidden;background:#fff}
#stage{box-shadow:0 1px 3px #0003,0 4px 14px #0001;overflow:visible;--hs:11px;--ow:2px}
#stage .clip{position:absolute;inset:0;overflow:hidden}
.el{position:absolute;cursor:move}
.el .bg{position:absolute;inset:0}
.el .txt{position:absolute;inset:0;padding:6px 10px;display:flex;flex-direction:column;overflow-wrap:anywhere;line-height:1.2;outline:none}
.el img{width:100%;height:100%;display:block;object-fit:fill;user-select:none;-webkit-user-drag:none}
#stage .el:hover{outline:var(--ow) solid #1a73e866}
#stage .el.sel{outline:var(--ow) solid var(--sel)}
#stage .el.editing{cursor:text}
#stage .el.editing .txt{cursor:text}
.h{position:absolute;width:var(--hs);height:var(--hs);background:#fff;border:calc(var(--hs)/5) solid var(--sel);border-radius:50%;z-index:5}
.h[data-dir=nw]{left:calc(var(--hs)/-2);top:calc(var(--hs)/-2);cursor:nwse-resize}
.h[data-dir=n]{left:calc(50% - var(--hs)/2);top:calc(var(--hs)/-2);cursor:ns-resize}
.h[data-dir=ne]{right:calc(var(--hs)/-2);top:calc(var(--hs)/-2);cursor:nesw-resize}
.h[data-dir=e]{right:calc(var(--hs)/-2);top:calc(50% - var(--hs)/2);cursor:ew-resize}
.h[data-dir=se]{right:calc(var(--hs)/-2);bottom:calc(var(--hs)/-2);cursor:nwse-resize}
.h[data-dir=s]{left:calc(50% - var(--hs)/2);bottom:calc(var(--hs)/-2);cursor:ns-resize}
.h[data-dir=sw]{left:calc(var(--hs)/-2);bottom:calc(var(--hs)/-2);cursor:nesw-resize}
.h[data-dir=w]{left:calc(var(--hs)/-2);top:calc(50% - var(--hs)/2);cursor:ew-resize}
.guide{position:absolute;background:#ff3d8b;z-index:9;display:none;pointer-events:none}
#gv{left:480px;top:0;width:var(--ow);height:540px}
#gh{top:270px;left:0;height:var(--ow);width:960px}
#magicBar{display:flex;align-items:center;gap:8px;margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:14px;flex:none}
#magicBar b{white-space:nowrap}
#slideMagic{flex:1;min-width:120px;border:1px solid transparent;border-radius:6px;padding:6px 8px;font:inherit;font-size:14px;background:#f8f9fa}
#slideMagic:focus{outline:2px solid var(--sel);background:#fff}
#magicBar.has{border-color:#81c995;background:#e6f4ea}
#magicHint{color:var(--muted);font-size:12px;white-space:nowrap}
.thumb .num .mic{display:block;font-size:11px;margin-top:2px}
.mw .slist{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:13px}
.mw .slist span{color:var(--muted);max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mw .slist input{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:6px}
#notes{height:74px;margin-top:10px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;background:#fff;flex:none}
#notes:focus{outline:2px solid var(--sel);border-color:transparent}
.pop{position:fixed;z-index:100;background:#fff;border-radius:8px;box-shadow:0 2px 6px #0003,0 8px 24px #0002;padding:6px 0;min-width:200px;max-height:80vh;overflow:auto}
.pop button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;padding:7px 16px;cursor:pointer;font-size:14px}
.pop button:hover{background:#f1f3f4}
.pop button.chk::after{content:"✓";margin-left:auto;color:var(--sel);font-weight:700}
.pop hr{border:0;border-top:1px solid var(--line);margin:5px 0}
.pop .sw{width:26px;height:16px;border-radius:3px;border:1px solid #0002;flex:none}
.pop .kbd{margin-left:auto;color:var(--muted);font-size:12px}
.shapegrid{display:grid;grid-template-columns:repeat(4,44px);gap:4px;padding:6px 10px}
.shapegrid button{padding:6px;justify-content:center;border-radius:6px}
.shapegrid i{display:block;width:28px;height:22px;background:#5f6368}
#show{position:fixed;inset:0;background:#000;z-index:200;cursor:pointer}
#show .slide{animation:none}
#show .fade{animation:fadeIn .5s ease}
#show .slidein{animation:slideIn .5s ease}
#show .zoom{animation:zoomIn .45s ease}
@keyframes fadeIn{from{opacity:0}}
@keyframes slideIn{from{opacity:0;translate:120px 0}}
@keyframes zoomIn{from{opacity:0;scale:.85}}
#showCount{position:fixed;right:16px;bottom:12px;color:#fffc;text-shadow:0 1px 3px #000;font-size:14px;z-index:201;pointer-events:none}
#showEnd{position:fixed;inset:0;display:grid;place-items:center;font-size:20px}#showEnd::before{content:"";}#showEnd{color:#fff;text-shadow:0 1px 4px #000}
#toast{position:fixed;left:50%;bottom:24px;translate:-50% 0;background:#323232;color:#fff;padding:10px 18px;border-radius:6px;font-size:14px;z-index:300;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}
#printArea{display:none}
footer{display:flex;align-items:center;gap:10px;padding:6px 14px;background:#fff;border-top:1px solid var(--line);flex:none;min-height:46px}
#adSlot{flex:1;min-width:0}
.ad{display:flex;align-items:center;gap:10px;padding:5px 8px 5px 10px;border-radius:9px;font-size:13px;animation:adIn .5s ease;min-width:0}
@keyframes adIn{from{opacity:0;translate:0 6px}}
.ad .adtag{font-size:10px;font-weight:800;padding:1px 5px;border-radius:3px;background:#0003;color:#fff;flex:none}
.ad .adico{font-size:20px;flex:none}
.ad b{white-space:nowrap}
.ad .adsub{opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ad button{margin-left:auto;flex:none;border:0;border-radius:16px;padding:6px 14px;font-weight:700;cursor:pointer}
.ad-donate{background:linear-gradient(90deg,#ffe082,#ffab91);color:#4e2a00}
.ad-donate button{background:#4e2a00;color:#fff}
.ad-box{background:linear-gradient(90deg,#1a1033,#3b1f6b);color:#ffe9a8}
.ad-box button{background:#ffd54f;color:#1a1033}
.ad-sky{background:linear-gradient(90deg,#4fc3f7,#81c784);color:#0d3b1e}
.ad-sky button{background:#2e7d32;color:#fff}
.fullad{position:fixed;inset:0;z-index:145;display:grid;place-items:center;text-align:center;padding:60px 20px 40px;animation:fadeIn .4s ease;overflow:auto}
.fullad.ad-donate{background:linear-gradient(135deg,#ffe082,#ffab91)}
.fullad.ad-box{background:radial-gradient(circle at 50% 30%,#4a2a85,#1a1033 70%)}
.fullad.ad-sky{background:linear-gradient(180deg,#4fc3f7 0%,#b3e5fc 55%,#81c784 100%)}
.fullad .fa-tag{position:absolute;top:16px;left:16px;font-weight:800;font-size:13px;background:#0005;color:#fff;padding:3px 9px;border-radius:5px}
.fullad .fa-close{position:absolute;top:14px;right:16px;border:0;border-radius:20px;padding:9px 18px;font-weight:700;font-size:14px;background:#fff;color:#222;cursor:pointer;box-shadow:0 2px 8px #0003}
.fullad .fa-close:disabled{opacity:.65;cursor:default}
.fa-body{max-width:780px}
.fa-ico{font-size:clamp(80px,14vw,150px);line-height:1.1;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px)}}
.fullad h1{font-size:clamp(32px,5.5vw,64px);margin:10px 0 8px;line-height:1.1}
.fa-sub{font-size:clamp(18px,2.4vw,26px);margin:0 0 18px;opacity:.9}
.fa-more{font-size:clamp(15px,1.8vw,19px);line-height:1.75;margin:0 0 24px}
.fa-small{font-size:13px;opacity:.75;margin-top:14px}
.fullad .fa-go{border:0;border-radius:32px;padding:16px 42px;font-size:22px;font-weight:800;cursor:pointer;box-shadow:0 4px 14px #0003;transition:transform .15s}
.fullad .fa-go:hover{transform:scale(1.06)}
.donate{margin-left:auto;background:#ffcc33;color:#4e2a00;font-weight:700;border-radius:18px;padding:7px 16px}
.donate:hover{background:#ffb300!important}
.planchip{background:#fff3cd;color:#7a4b00;border-radius:16px;font-weight:600}
#paywall{position:fixed;inset:0;z-index:140;background:linear-gradient(160deg,#fff7e0,#f1f3f4 45%,#e8f0fe);overflow:auto;padding:28px 16px}
.pw{max-width:1040px;margin:0 auto;text-align:center}
.pw h1{margin:10px 0 4px;font-size:32px}
.pw .sub{color:var(--muted);margin:0 0 18px;font-size:16px}
.pw .logo{margin:0 auto;width:56px;height:56px;font-size:28px;border-radius:14px}
.pwtoggle{display:inline-flex;background:#fff;border-radius:24px;padding:4px;box-shadow:0 1px 3px #0002;margin-bottom:22px}
.pwtoggle button{border:0;background:none;padding:8px 20px;border-radius:20px;cursor:pointer;font-weight:600;font-size:14px}
.pwtoggle button.on{background:var(--accent);color:#fff}
.pwgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;text-align:left}
.card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 1px 3px #0002,0 6px 20px #0001;display:flex;flex-direction:column;gap:8px;border:2px solid transparent;position:relative}
.card.best{border-color:var(--accent)}
.card.mine{border-color:#34a853}
.card .badge{position:absolute;top:-11px;left:16px;background:var(--accent);color:#fff;font-size:11px;font-weight:800;padding:3px 10px;border-radius:10px}
.card.mine .badge{background:#34a853}
.card h3{margin:4px 0 0;font-size:18px}
.card .price{font-size:30px;font-weight:800}
.card .price small{font-size:14px;font-weight:500;color:var(--muted)}
.card .save{color:#188038;font-size:13px;font-weight:600;min-height:18px}
.card ul{margin:4px 0 8px;padding-left:0;list-style:none;font-size:14px;line-height:1.7;flex:1}
.card .get{border:0;border-radius:22px;padding:11px;font-weight:700;font-size:15px;cursor:pointer;background:var(--sel);color:#fff}
.card .get:hover{background:#1557b0}
.card .get:disabled{background:#34a853;cursor:default}
.pwfoot{margin-top:22px;color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-items:center}
.pwfoot .btn{color:var(--text)}
.amts{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.amts button{border:2px solid var(--line);background:#fff;border-radius:20px;padding:8px 16px;font-weight:700;cursor:pointer;font-size:15px}
.amts button.on{border-color:#ffb300;background:#fff3cd}
.mw input.money{font:inherit;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;width:140px}
#micDot{position:fixed;left:16px;bottom:12px;z-index:201;color:#fff;font-size:14px;background:#0008;padding:5px 12px;border-radius:16px;pointer-events:none;transition:background .2s,transform .2s}
#micDot.heard{background:#2e7d32;transform:scale(1.15)}
#micDot.off{background:#b71c1c}
.mw{padding:18px 20px;overflow:auto;flex:1}
.mw h3{margin:14px 0 6px;font-size:15px}
.mw p{margin:4px 0 8px;color:var(--muted);font-size:13px}
.mw textarea{width:100%;height:90px;font:inherit;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;resize:vertical}
.mw .row{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:14px}
#mwTest{margin-top:6px;padding:10px 12px;border-radius:8px;background:#f1f3f4;min-height:40px;font-size:14px}
.modalbg{position:fixed;inset:0;background:#0006;z-index:150;display:grid;place-items:center}
.modal{background:#fff;border-radius:12px;width:min(880px,94vw);height:min(640px,90vh);display:flex;flex-direction:column;box-shadow:0 10px 40px #0005;overflow:hidden}
.modal .top{display:flex;gap:8px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.modal .top input{flex:1;font-size:16px;padding:9px 14px;border:1px solid var(--line);border-radius:22px;outline:none}
.modal .top input:focus{border-color:var(--sel)}
.modal .go{background:var(--sel);color:#fff;border-radius:22px;padding:9px 18px;font-weight:600}
.modal .go:hover{background:#1557b0!important}
.modal .x{font-size:20px}
.modal .grid{flex:1;overflow:auto;padding:12px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));grid-auto-rows:120px;gap:10px;align-content:start}
.modal .pic{position:relative;border-radius:8px;overflow:hidden;cursor:pointer;background:#eee;border:0;padding:0}
.modal .pic img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
.modal .pic:hover img{transform:scale(1.06)}
.modal .pic span{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,#000c);color:#fff;font-size:11px;padding:14px 6px 4px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modal .pic.loading::after{content:"Adding…";position:absolute;inset:0;background:#fffc;display:grid;place-items:center;font-weight:600}
.modal .msg{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 10px;font-size:15px}
.modal .foot{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.modal .foot label{display:flex;gap:6px;align-items:center;cursor:pointer;color:var(--text);font-size:13px}
@media print{
  @page{size:960px 540px;margin:0}
  body{display:block;background:#fff;overflow:visible}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
  #printArea .slide{position:relative;page-break-after:always;break-after:page;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header>
  <div class="logo">▶</div>
  <div class="titlebox">
    <input id="deckTitle" value="My presentation" spellcheck="false">
    <div class="menus">
      <button class="btn" id="mFile">File</button>
      <button class="btn" id="mEdit">Edit</button>
      <button class="btn" id="mInsert">Insert</button>
      <button class="btn" id="mSlide">Slide</button>
      <button class="btn" id="mTheme">Theme</button>
      <button class="btn" id="mHelp">Help</button>
    </div>
  </div>
  <button class="btn planchip" id="planChip" hidden title="Your plan"></button>
  <button class="btn" id="micBtn" title="Magic words: say a word to change slides">🎤 Magic words</button>
  <button class="btn present" id="presentBtn" title="Present (Ctrl+Enter)">▶ Slideshow</button>
  <button class="btn share" id="shareBtn" title="Send this slide show to someone on Gmail">🔗 Share</button>
</header>

<div class="toolbar" id="toolbar">
  <button class="btn" id="undoBtn" title="Undo (Ctrl+Z)">↶</button>
  <button class="btn" id="redoBtn" title="Redo (Ctrl+Y)">↷</button>
  <div class="sep"></div>
  <button class="btn" id="newSlideBtn" title="New slide">＋ Slide ▾</button>
  <div class="sep"></div>
  <button class="btn" id="textBtn" title="Text box"><b>T</b> Text</button>
  <button class="btn" id="shapeBtn" title="Shape">◆ Shape ▾</button>
  <button class="btn" id="imgBtn" title="Picture">🖼 Picture ▾</button>
  <div class="sep"></div>
  <select id="fontSel" data-need="text" title="Font"></select>
  <button class="btn" id="sizeDown" data-need="text" title="Smaller">−</button>
  <input id="fontSize" data-need="text" type="number" min="6" max="300" title="Font size">
  <button class="btn" id="sizeUp" data-need="text" title="Bigger">＋</button>
  <div class="sep"></div>
  <button class="btn" id="boldBtn" data-need="text" title="Bold (Ctrl+B)"><b>B</b></button>
  <button class="btn" id="italicBtn" data-need="text" title="Italic (Ctrl+I)"><i>I</i></button>
  <button class="btn" id="underBtn" data-need="text" title="Underline (Ctrl+U)"><u>U</u></button>
  <label class="btn colorbtn" title="Text color"><b>A</b><span class="bar" id="textColorBar"></span><input type="color" id="textColor" data-need="text"></label>
  <label class="btn colorbtn" title="Fill color"><span>🪣</span><span class="bar" id="fillColorBar"></span><input type="color" id="fillColor" data-need="text"></label>
  <button class="btn" id="noFillBtn" data-need="text" title="No fill">⊘</button>
  <div class="sep"></div>
  <button class="btn" id="alignL" data-need="text" title="Align left">⫷</button>
  <button class="btn" id="alignC" data-need="text" title="Center">≡</button>
  <button class="btn" id="alignR" data-need="text" title="Align right">⫸</button>
  <button class="btn" id="valignBtn" data-need="text" title="Vertical position">⇕</button>
  <div class="sep"></div>
  <button class="btn" id="frontBtn" data-need="el" title="Bring to front">⬆ Front</button>
  <button class="btn" id="backBtn" data-need="el" title="Send to back">⬇ Back</button>
  <button class="btn" id="delBtn" data-need="el" title="Delete (Del)">🗑</button>
  <div class="sep"></div>
  <label class="btn colorbtn" title="Slide background"><span>🎨</span><span class="bar" id="bgColorBar"></span><input type="color" id="bgColor"></label>
</div>

<main>
  <div id="sidebar"></div>
  <div id="work">

    <div id="magicBar"><b>🎤 Magic word for this slide:</b>
      <input id="slideMagic" placeholder="e.g. hot chocolate — leave empty to use the every-slide words" autocomplete="off">
      <span id="magicHint"></span></div>
    <textarea id="notes" placeholder="Click to add speaker notes"></textarea>
  </div>
</main>

<footer id="footbar"><div id="adSlot" hidden></div><button class="btn donate" id="donateBtn" title="Give money to support my apps">💛 Donate</button></footer>
<div id="paywall" hidden><div class="pw">

  <div class="pwtoggle"><button data-per="month" class="on">Monthly</button><button data-per="year">Yearly · save more</button></div>
  <div class="pwgrid" id="pwGrid"></div>
  <div class="pwfoot"><span id="pwNote"></span>
    <button class="btn" id="pwCancel" hidden>Cancel my plan</button>
    <button class="btn" id="pwClose" hidden>✕ Back to my slides</button>
    <button class="btn donate" id="pwDonate" style="margin-left:0">💛 Donate</button></div>
</div></div>

<div id="show" hidden><div id="showInner"></div><div id="showCount"></div><div id="micDot" hidden>🎤 listening</div></div>

<div id="printArea"></div>
<input type="file" id="imgFile" accept="image/*" hidden>
<input type="color" id="showBgInput" hidden>
<input type="file" id="openFile" accept=".json,application/json" hidden>

<script>
const W = 960, H = 540, KEY = 'slideStudio.v1';
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);

const THEMES = {
  simple: {name:'Simple Light', bg:'#ffffff', title:'#202124', text:'#3c4043', font:'Arial', accent:'#1a73e8'},
  midnight:{name:'Midnight', bg:'#1e1f2b', title:'#ffffff', text:'#c9cbe0', font:'Arial', accent:'#7c8cff'},
  sunny:  {name:'Sunny', bg:'#fff4d6', title:'#b35c00', text:'#5a3d00', font:'Georgia', accent:'#f4a100'},
  ocean:  {name:'Ocean', bg:'#e0f2f7', title:'#0b4f6c', text:'#145c75', font:'Verdana', accent:'#01a7d6'},
  forest: {name:'Forest', bg:'#1f3b2c', title:'#e8f5e9', text:'#b9dcc1', font:'Trebuchet MS', accent:'#66bb6a'},
  candy:  {name:'Candy', bg:'#ffe3f1', title:'#c2185b', text:'#6a1b4d', font:'Comic Sans MS', accent:'#ff4fa3'},
  space:  {name:'Space', bg:'linear-gradient(135deg,#0f0c29,#302b63,#24243e)', title:'#ffd54f', text:'#e0e0ff', font:'Impact', accent:'#ff7043'},
  sunset: {name:'Sunset', bg:'linear-gradient(135deg,#ff9a56,#ff5e7e)', title:'#ffffff', text:'#fff3ea', font:'Trebuchet MS', accent:'#5b2a86'},
  paper:  {name:'Notebook', bg:'repeating-linear-gradient(#fdfdf6 0 31px,#cfe3f5 31px 32px)', title:'#c62828', text:'#263238', font:'Courier New', accent:'#42a5f5'},
};
const FONTS = ['Arial','Verdana','Trebuchet MS','Georgia','Times New Roman','Courier New','Comic Sans MS','Impact','Helvetica','Futura','Chalkboard SE','Marker Felt'];
const SHAPES = {
  none:{}, rect:{}, rounded:{radius:'18px'}, ellipse:{radius:'50%'},
  triangle:{clip:'polygon(50% 0,100% 100%,0 100%)'},
  diamond:{clip:'polygon(50% 0,100% 50%,50% 100%,0 50%)'},
  star:{clip:'polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)'},
  arrow:{clip:'polygon(0 30%,62% 30%,62% 0,100% 50%,62% 100%,62% 70%,0 70%)'},
  hexagon:{clip:'polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)'},
  pentagon:{clip:'polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%)'},
  bubble:{clip:'polygon(0 0,100% 0,100% 75%,40% 75%,20% 100%,22% 75%,0 75%)'},
  cross:{clip:'polygon(35% 0,65% 0,65% 35%,100% 35%,100% 65%,65% 65%,65% 100%,35% 100%,35% 65%,0 65%,0 35%,35% 35%)'},
};
const LAYOUTS = [
  ['title','🏷️ Title slide'],['content','📝 Title and body'],['section','🧱 Section header'],
  ['two','🪟 Two columns'],['big','💥 Big idea'],['blank','⬜ Blank'],
];

let deck, cur = 0, selId = null, editingId = null, scale = 1, drag = null, clip = null;
let hist = [], hp = -1, saveWarned = false;

/* ---------- model helpers ---------- */
const slide = () => deck.slides[cur];
const findEl = id => slide().els.find(e => e.id === id);
const selEl = () => selId ? findEl(selId) : null;
const theme = () => THEMES[deck.theme] || THEMES.simple;

function textEl(role, x, y, w, h, text, size, extra = {}) {
  const t = theme();
  return {id:uid(), type:'text', role, shape:'none', x, y, w, h, text, fontSize:size,
    color: role === 'title' ? t.title : t.text, font:t.font, bold: role === 'title',
    italic:false, underline:false, align:'left', valign:'top', fill:'transparent', ...extra};
}
function makeSlide(layout) {
  const T = textEl; let els = [];
  switch (layout) {
    case 'title': els = [T('title',80,150,800,130,'Click twice to add a title',56,{align:'center',valign:'bottom'}),
                         T('body',80,295,800,70,'Subtitle',28,{align:'center'})]; break;
    case 'content': els = [T('title',60,36,840,90,'Slide title',42,{valign:'middle'}),
                           T('body',60,140,840,360,'• First point<br>• Second point<br>• Third point',28)]; break;
    case 'section': els = [T('title',80,190,800,160,'Section heading',62,{align:'center',valign:'middle'})]; break;
    case 'two': els = [T('title',60,36,840,90,'Slide title',42,{valign:'middle'}),
                       T('body',60,140,410,360,'• Left side',26), T('body',490,140,410,360,'• Right side',26)]; break;
    case 'big': els = [T('title',60,150,840,240,'BIG IDEA!',110,{align:'center',valign:'middle'})]; break;
  }
  return {id:uid(), bg:theme().bg, notes:'', els};
}
function newDeck() {
  deck = {title:'My presentation', theme:'simple', transition:'fade', slides:[]};
  deck.slides.push(makeSlide('title'));
}

/* ---------- history & saving ---------- */
function commit() {
  const j = JSON.stringify(deck);
  if (hist[hp] === j) return;
  hist = hist.slice(0, hp + 1); hist.push(j);
  if (hist.length > 80) hist.shift();
  hp = hist.length - 1;
  save(j);
}
function save(j) {
  try { localStorage.setItem(KEY, j); saveWarned = false; }
  catch (e) { if (!saveWarned) { toast('⚠️ Too big to auto-save — use File → Save to computer'); saveWarned = true; } }
}
function loadJSON(j) {
  deck = JSON.parse(j);
  cur = Math.min(cur, deck.slides.length - 1);
  if (selId && !findEl(selId)) selId = null;
  renderAll(); save(j);
}
function undo() { endEdit(); if (hp > 0) { hp--; loadJSON(hist[hp]); } }
function redo() { endEdit(); if (hp < hist.length - 1) { hp++; loadJSON(hist[hp]); } }

/* ---------- rendering ---------- */
function elNode(el) {
  const d = document.createElement('div'); d.className = 'el'; d.dataset.id = el.id;
  if (el.type === 'image') {
    const img = document.createElement('img'); img.src = el.src; img.draggable = false; img.alt = '';
    d.appendChild(img);
  } else {
    const bg = document.createElement('div'); bg.className = 'bg';
    const t = document.createElement('div'); t.className = 'txt'; t.innerHTML = el.text || '';
    d.append(bg, t);
  }
  styleEl(d, el);
  return d;
}
function styleEl(d, el) {
  Object.assign(d.style, {left:el.x + 'px', top:el.y + 'px', width:el.w + 'px', height:el.h + 'px'});
  if (el.type === 'image') return;
  const s = SHAPES[el.shape] || {}, bg = d.querySelector('.bg'), t = d.querySelector('.txt');
  Object.assign(bg.style, {background: el.fill || 'transparent', borderRadius: s.radius || '', clipPath: s.clip || ''});
  Object.assign(d.style, {fontSize: el.fontSize + 'px', color: el.color, fontFamily: `"${el.font}", sans-serif`,
    fontWeight: el.bold ? '700' : '400', fontStyle: el.italic ? 'italic' : 'normal',
    textDecoration: el.underline ? 'underline' : 'none', textAlign: el.align});
  t.style.justifyContent = {top:'flex-start', middle:'center', bottom:'flex-end'}[el.valign] || 'flex-start';
}
function fillSlide(container, s) {
  container.style.background = s.bg;
  s.els.forEach(el => container.appendChild(elNode(el)));
}
const stage = $('#stage');
function renderStage() {
  const s = slide();
  stage.innerHTML = '<div class="clip"></div><div class="guide" id="gv"></div><div class="guide" id="gh"></div>';
  stage.style.background = s.bg;
  const c = stage.firstChild;
  s.els.forEach(el => {
    const n = elNode(el);
    if (el.id === selId) {
      n.classList.add('sel');
      ['nw','n','ne','e','se','s','sw','w'].forEach(dir => {
        const h = document.createElement('div'); h.className = 'h'; h.dataset.dir = dir; n.appendChild(h);
      });
    }
    c.appendChild(n);
  });
  // selected element sits above the clip so its handles are never cut off
  const selNode = c.querySelector('.sel');
  if (selNode) { c.style.overflow = 'visible'; }
  else c.style.overflow = 'hidden';
  if (document.activeElement !== $('#notes')) $('#notes').value = s.notes || '';
  syncMagicBar();
  syncToolbar();
}
function renderThumbs() {
  const side = $('#sidebar'); side.innerHTML = '';
  deck.slides.forEach((s, i) => {
    const t = document.createElement('div');
    t.className = 'thumb' + (i === cur ? ' active' : ''); t.draggable = true;
    t.innerHTML = `<div class="num">${i + 1}${s.magic && s.magic.length ? '<span class="mic" title="Has its own magic word">🎤</span>' : ''}</div><div class="mini"><div class="slide"></div></div>`;
    fillSlide(t.querySelector('.slide'), s);
    t.onclick = () => go(i);
    t.oncontextmenu = e => { e.preventDefault(); go(i); openMenu(e.clientX, e.clientY, slideItems()); };
    t.addEventListener('dragstart', e => { dragFrom = i; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(i)); });
    t.addEventListener('dragover', e => { if (dragFrom != null) { e.preventDefault(); t.classList.add('over'); } });
    t.addEventListener('dragleave', () => t.classList.remove('over'));
    t.addEventListener('drop', e => {
      e.preventDefault(); t.classList.remove('over');
      if (dragFrom == null || dragFrom === i) return;
      const [m] = deck.slides.splice(dragFrom, 1); deck.slides.splice(i, 0, m);
      cur = i; dragFrom = null; commit(); renderAll();
    });
    t.addEventListener('dragend', () => dragFrom = null);
    side.appendChild(t);
  });
  const add = document.createElement('button'); add.className = 'addslide'; add.textContent = '＋ New slide';
  add.onclick = () => addSlide('content'); side.appendChild(add);
  const first = side.querySelector('.mini');
  if (first) { const k = first.clientWidth / W; side.querySelectorAll('.mini .slide').forEach(sl => sl.style.transform = `scale(${k})`); }
  const act = side.querySelector('.thumb.active'); if (act) act.scrollIntoView({block:'nearest'});
}
let dragFrom = null, thumbFocus = false;
document.addEventListener('pointerdown', e => {
  thumbFocus = !!e.target.closest('#sidebar .thumb');
  $('#sidebar').classList.toggle('focus', thumbFocus);
}, true);
function renderAll() {
  $('#deckTitle').value = deck.title; document.title = deck.title + ' – Slide Studio';
  renderThumbs(); renderStage(); if (typeof syncMicBtn === 'function') syncMicBtn();
}
function fitStage() {
  const r = $('#wrap').getBoundingClientRect();
  scale = Math.max(0.1, Math.min((r.width - 40) / W, (r.height - 30) / H));
  stage.style.transform = `scale(${scale})`;
  stage.style.left = (r.width - W * scale) / 2 + 'px';
  stage.style.top = Math.max(10, (r.height - H * scale) / 2) + 'px';
  stage.style.setProperty('--hs', (12 / scale) + 'px');
  stage.style.setProperty('--ow', (2 / scale) + 'px');
}
new ResizeObserver(() => { fitStage(); }).observe($('#wrap'));

/* ---------- toolbar state ---------- */
const hex = c => (typeof c === 'string' && /^#[0-9a-f]{6}$/i.test(c)) ? c : null;
function syncToolbar() {
  const el = selEl(), isText = !!el && el.type !== 'image';
  document.querySelectorAll('[data-need=text]').forEach(b => b.disabled = !isText);
  document.querySelectorAll('[data-need=el]').forEach(b => b.disabled = !el);
  $('#undoBtn').disabled = hp <= 0; $('#redoBtn').disabled = hp >= hist.length - 1;
  if (isText) {
    $('#fontSel').value = el.font; $('#fontSize').value = el.fontSize;
    $('#boldBtn').classList.toggle('on', el.bold);
    $('#italicBtn').classList.toggle('on', el.italic);
    $('#underBtn').classList.toggle('on', el.underline);
    ['L','C','R'].forEach(a => $('#align' + a).classList.toggle('on', el.align === {L:'left',C:'center',R:'right'}[a]));
    $('#textColor').value = hex(el.color) || '#000000'; $('#textColorBar').style.background = el.color;
    $('#fillColor').value = hex(el.fill) || '#ffffff';
    $('#fillColorBar').style.background = el.fill === 'transparent' ? 'repeating-conic-gradient(#ccc 0 25%,#fff 0 50%) 0 0/6px 6px' : el.fill;
  } else {
    ['#boldBtn','#italicBtn','#underBtn','#alignL','#alignC','#alignR'].forEach(s => $(s).classList.remove('on'));
    $('#fontSize').value = '';
    $('#textColorBar').style.background = '#ccc'; $('#fillColorBar').style.background = '#ccc';
  }
  const bg = slide().bg; $('#bgColor').value = hex(bg) || '#ffffff'; $('#bgColorBar').style.background = bg;
}
function liveNode(id) { return stage.querySelector(`.el[data-id="${id}"]`); }
function applyProp(key, val, live = false) {
  const el = selEl(); if (!el) return;
  el[key] = val;
  const n = liveNode(el.id); if (n) styleEl(n, el);
  syncToolbar();
  if (!live) { commit(); renderThumbs(); }
}

/* ---------- selection, editing ---------- */
function select(id) {
  if (selId !== id) { selId = id; renderStage(); } else syncToolbar();
}
function startEdit(id) {
  const el = findEl(id); if (!el || el.type === 'image') return;
  if (selId !== id) { selId = id; renderStage(); }
  const n = liveNode(id), t = n.querySelector('.txt');
  editingId = id; n.classList.add('editing');
  t.contentEditable = 'true'; t.focus();
  const r = document.createRange(); r.selectNodeContents(t);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  t.addEventListener('blur', endEdit, {once:true});
}
function endEdit() {
  if (!editingId) return;
  const id = editingId; editingId = null;
  const el = findEl(id), n = liveNode(id);
  if (n) {
    const t = n.querySelector('.txt'); t.contentEditable = 'false'; n.classList.remove('editing');
    if (el) el.text = t.innerHTML;
  }
  getSelection().removeAllRanges();
  commit(); renderThumbs(); syncToolbar();
}
stage.addEventListener('paste', e => {
  if (!editingId) return;
  const txt = e.clipboardData.getData('text/plain');
  if (txt) { e.preventDefault(); document.execCommand('insertText', false, txt); }
});

/* ---------- mouse: move & resize ---------- */
stage.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  const h = e.target.closest('.h'), n = e.target.closest('.el');
  if (n && n.dataset.id === editingId && !h) return;          // clicking inside the text being typed
  endEdit();
  if (h) {
    const el = selEl(); drag = {mode:'resize', dir:h.dataset.dir, id:el.id, sx:e.clientX, sy:e.clientY, o:{...el}};
  } else if (n) {
    select(n.dataset.id);
    const el = selEl(); drag = {mode:'move', id:el.id, sx:e.clientX, sy:e.clientY, o:{...el}};
  } else { select(null); return; }
  e.preventDefault();
});
$('#wrap').addEventListener('pointerdown', e => { if (e.target.id === 'wrap') { endEdit(); select(null); } });
window.addEventListener('pointermove', e => {
  if (!drag) return;
  const el = findEl(drag.id); if (!el) return;
  const o = drag.o, dx = (e.clientX - drag.sx) / scale, dy = (e.clientY - drag.sy) / scale;
  if (!drag.moved && Math.abs(dx) + Math.abs(dy) < 3) return;
  drag.moved = true;
  const gv = $('#gv'), gh = $('#gh');
  if (drag.mode === 'move') {
    let x = o.x + dx, y = o.y + dy, snapX = false, snapY = false;
    if (!e.altKey) {
      if (Math.abs(x + o.w / 2 - W / 2) < 8) { x = W / 2 - o.w / 2; snapX = true; }
      if (Math.abs(y + o.h / 2 - H / 2) < 8) { y = H / 2 - o.h / 2; snapY = true; }
    }
    gv.style.display = snapX ? 'block' : 'none'; gh.style.display = snapY ? 'block' : 'none';
    el.x = Math.round(x); el.y = Math.round(y);
  } else {
    const d = drag.dir; let x = o.x, y = o.y, w = o.w, h = o.h;
    if (d.includes('e')) w = o.w + dx;
    if (d.includes('w')) { w = o.w - dx; }
    if (d.includes('s')) h = o.h + dy;
    if (d.includes('n')) { h = o.h - dy; }
    w = Math.max(20, w); h = Math.max(20, h);
    if (d.length === 2 && (e.shiftKey || el.type === 'image')) h = w * o.h / o.w;
    if (d.includes('w')) x = o.x + o.w - w;
    if (d.includes('n')) y = o.y + o.h - h;
    Object.assign(el, {x:Math.round(x), y:Math.round(y), w:Math.round(w), h:Math.round(h)});
  }
  const n = liveNode(el.id); if (n) styleEl(n, el);
});
window.addEventListener('pointerup', () => {
  if (!drag) return;
  if (drag.moved) { commit(); renderThumbs(); }
  drag = null;
  const gv = $('#gv'), gh = $('#gh'); if (gv) gv.style.display = 'none'; if (gh) gh.style.display = 'none';
});
stage.addEventListener('dblclick', e => {
  const n = e.target.closest('.el'); if (n) startEdit(n.dataset.id);
});
stage.addEventListener('contextmenu', e => {
  const n = e.target.closest('.el'); if (!n || n.dataset.id === editingId) return;
  e.preventDefault(); select(n.dataset.id); openMenu(e.clientX, e.clientY, editItems());
});

/* ---------- element actions ---------- */
function addEl(el, edit) {
  slide().els.push(el); selId = el.id; commit(); renderAll();
  if (edit) startEdit(el.id);
}
function addText() { addEl(textEl('body', 330, 220, 300, 90, 'Type here', 28), true); }
function addShape(shape) {
  const t = theme(), sz = shape === 'arrow' ? [260, 140] : shape === 'bubble' ? [280, 180] : [200, 200];
  addEl(textEl('shape', (W - sz[0]) / 2, (H - sz[1]) / 2, sz[0], sz[1], '', 26,
    {shape, fill:t.accent, color:'#ffffff', align:'center', valign: shape === 'bubble' ? 'top' : 'middle', bold:true}));
}
// Turn a picture file/blob into a small-enough data URL that saves inside the presentation
function blobToSrc(blob) {
  return new Promise((ok, fail) => {
    const fr = new FileReader();
    fr.onerror = fail;
    fr.onload = () => {
      const img = new Image();
      img.onerror = fail;
      img.onload = () => {
        let src = fr.result, w = img.naturalWidth, h = img.naturalHeight, max = 1400;
        if (w > max || h > max || blob.size > 600000) {
          const k = Math.min(1, max / Math.max(w, h)), c = document.createElement('canvas');
          c.width = Math.round(w * k); c.height = Math.round(h * k);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          src = blob.type === 'image/png' ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.85);
          w = c.width; h = c.height;
        }
        ok({src, w, h});
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(blob);
  });
}
function placeImage({src, w, h}, credit) {
  const k2 = Math.min(520 / w, (credit ? 330 : 360) / h, 1), ew = Math.round(w * k2), eh = Math.round(h * k2);
  const x = Math.round((W - ew) / 2), y = Math.round((H - eh) / 2) - (credit ? 14 : 0);
  const img = {id:uid(), type:'image', src, x, y, w:ew, h:eh};
  slide().els.push(img);
  if (credit) slide().els.push(textEl('credit', x, y + eh + 2, Math.max(ew, 260), 26, credit, 12,
    {italic:true, padding:0, color: theme().text}));
  selId = img.id; commit(); renderAll();
}
function addImageFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  blobToSrc(file).then(r => placeImage(r)).catch(() => toast('⚠️ Could not open that picture'));
}
async function addImageFromUrl(url, credit) {
  try {                                   // best: download it so it lives inside the presentation
    const res = await fetch(url, {mode:'cors'});
    if (!res.ok) throw 0;
    const blob = await res.blob();
    if (!blob.type.startsWith('image/')) throw 0;
    placeImage(await blobToSrc(blob), credit);
    return true;
  } catch {}
  return new Promise(ok => {              // fallback: link to it (needs internet to show)
    const img = new Image();
    img.onload = () => { placeImage({src:url, w:img.naturalWidth, h:img.naturalHeight}, credit);
      toast('🔗 Picture linked — it needs internet to show'); ok(true); };
    img.onerror = () => { toast('⚠️ No picture found at that link'); ok(false); };
    img.src = url;
  });
}
function pictureFromLink() {
  const url = (prompt('Paste the picture\'s web address (link):\n\nTip: right-click a picture online → "Copy Image Address"') || '').trim();
  if (!url) return;
  if (!/^https?:\/\//i.test(url) && !url.startsWith('data:image/')) { toast('⚠️ That doesn\'t look like a web link'); return; }
  addImageFromUrl(url);
}

/* ---------- online picture search (Openverse: Flickr, Wikimedia & more; grown-up pictures filtered out) ---------- */
let searchState = null;
function openSearch() {
  endEdit();
  const bg = document.createElement('div'); bg.className = 'modalbg';
  bg.innerHTML = `<div class="modal">
    <div class="top"><span style="font-size:20px">🔍</span>
      <input id="psq" placeholder="Search pictures… (try: shark, volcano, puppy)" autocomplete="off">
      <button class="btn go" id="psgo">Search</button><button class="btn x" id="psx" title="Close">✕</button></div>
    <div class="grid" id="psgrid"><div class="msg">Type what you want a picture of, then press Enter 🙂</div></div>
    <div class="foot"><label><input type="checkbox" id="pscredit" checked> Put who took it under the picture</label>
      <span style="margin-left:auto">Free pictures from Openverse (Flickr, Wikimedia &amp; more)</span></div></div>`;
  document.body.appendChild(bg);
  const close = () => { bg.remove(); searchState = null; };
  bg.addEventListener('pointerdown', e => { if (e.target === bg) close(); });
  bg.querySelector('#psx').onclick = close;

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e => {

    return;
  }
  if (mod && k.toLowerCase() === 's') { e.preventDefault(); saveFile(); return; }
  if (mod && k === 'Enter') { e.preventDefault(); present(cur); return; }
  if (editingId) {

      e.preventDefault(); const el = selEl(), p = {b:'bold', i:'italic', u:'underline'}[k.toLowerCase()];

  if (mod && k.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }

        <li>✅ Pictures online, themes, 🎤 magic words</li>
        <li>${x.school ? '✅ Whole school — unlimited students &amp; teachers' : '✅ For 1 person'}</li>
        <li>${x.adfree ? '✅ No ads ✨' : '📢 Shows full-screen ads'}</li>
      </ul>
      <button class="get"${isMine ? ' disabled' : ''}>${isMine ? '✓ You have this' : mine ? 'Switch to this' : 'Get ' + x.name}</button>`;
    c.querySelector('.get').onclick = () => choosePlan(x.id);
    g.appendChild(c);
  });
}
document.querySelectorAll('.pwtoggle button').forEach(b => b.onclick = () => { pwPer = b.dataset.per; renderPlans(); });
function choosePlan(id) {
  const x = planInfo(id); let school = '';
  if (x.school) {
    school = (prompt('What is the name of the school?') || '').trim();
    if (!school) return;
  }
  if (PAY[id]) {                                     // real payment through Stripe
    try { localStorage.setItem('slideStudio.pendingSchool', school); } catch {}
    location.href = PAY[id]; return;
  }
  smallModal('🧪 Test mode', `<p>No real money is charged yet — a grown-up needs to connect payments first.</p>
    <p>Get <b>${x.name}</b>${school ? ' for <b>' + school.replace(/</g, '&lt;') + '</b>' : ''} for <b>${money(x.price)} / ${x.per}</b>?</p>`,
    'Get plan', () => grantPlan(id, school));
}
function grantPlan(id, school) {
  const x = planInfo(id), d = new Date();
  x.per === 'month' ? d.setMonth(d.getMonth() + 1) : d.setFullYear(d.getFullYear() + 1);
  setPlan({id, school, start:Date.now(), until:d.getTime(), test:!PAY[id]});
  toast(`⭐ You have ${x.name}! Have fun making slides`);
}
$('#planChip').onclick = () => showPaywall(true);
$('#pwClose').onclick = () => { if (activePlan()) $('#paywall').hidden = true; };
$('#pwCancel').onclick = () => smallModal('Cancel your plan?', '<p>You won\'t be able to make slides until you pick a plan again. Your slides stay saved.</p>',
  'Yes, cancel it', () => { setPlan(null); toast('Your plan is cancelled'); });
// keep the app locked while the plans screen is up
document.addEventListener('keydown', e => {
  if (!$('#paywall').hidden && !e.target.closest('.modalbg')) e.stopImmediatePropagation();
}, true);

function smallModal(title, html, okText, onOk) {
  const bg = document.createElement('div'); bg.className = 'modalbg';
  bg.innerHTML = `<div class="modal" style="height:auto;width:min(460px,94vw)">
    <div class="top"><b style="font-size:17px;flex:1">${title}</b><button class="btn x" title="Close">✕</button></div>
    <div class="mw">${html}</div>
    <div class="foot"><button class="btn" data-no style="margin-left:auto">Not now</button><button class="btn go" data-ok>${okText}</button></div></div>`;
  document.body.appendChild(bg);
  const close = () => bg.remove();
  bg.querySelector('.x').onclick = close; bg.querySelector('[data-no]').onclick = close;
  bg.querySelector('[data-ok]').onclick = () => { close(); onOk && onOk(); };
  bg.addEventListener('pointerdown', e => { if (e.target === bg) close(); });
  return bg;
}

// 📢 the 2 ads (only on plans without "Ad Free"; never in the slideshow)
const ADS = [
  {cls:'ad-donate', ico:'💛', title:'Donate If You Like My Apps And Games', sub:'Every bit helps me make more apps and games!',
   more:'<p class="fa-more">🎮 New games &nbsp;·&nbsp; 📱 New apps &nbsp;·&nbsp; ✨ New features</p>', btn:'💛 Donate', fn:() => openDonate()},
  {cls:'ad-box', ico:'🎩⚡', title:'Electrical Box, Cards, and Button', sub:'A magic trick invention!',
   more:`<p class="fa-more">🃏 Playing cards with <b>real little screens</b> — they change their face, switch their back color, or turn <b>see-through</b><br>
         📦 A box with a see-through window, an automatic lid and a <b>card launcher</b><br>🔘 A control panel of buttons runs it all</p>`,
   btn:'Coming soon! 😎', fn:() => openBoxAd()},
  {cls:'ad-sky', ico:'🏝️', title:'My SkyBlock', sub:'My NEW SkyBlock game for Minecraft!',
   more:`<p class="fa-more">🏝️ Your <b>own island</b> in the sky &nbsp;·&nbsp; 🏙️ Warp to the <b>Hub</b><br>
         ⛏️ Skills &amp; <b>minions</b> &nbsp;·&nbsp; 🐾 Pets &nbsp;·&nbsp; ⚔️ Slayer bosses<br>
         💰 Bazaar, Auction House &amp; Bank &nbsp;·&nbsp; 🤝 Co-op with a friend</p>`,
   small:'Needs Minecraft and the Mod Launcher', btn:'▶ Play it', fn:() => { location.href = 'mcmod://my-skyblock'; }},
];
const AD_EVERY = 2 * 60 * 1000, AD_WAIT = 5;          // a full-screen ad every 2 minutes, Close unlocks after 5 seconds
const adOpen = () => !$('#fullAd').hidden;
const canShowAd = () => show.hidden && $('#paywall').hidden && !editingId && !drag && !document.querySelector('.modalbg') && !adOpen();
function adTick() {
  if (!canShowAd()) { adTimer = setTimeout(adTick, 10000); return; }   // busy? try again in 10 seconds
  showFullAd();
  adTimer = setTimeout(adTick, AD_EVERY);
}
function showFullAd() {
  const a = ADS[adIdx++ % ADS.length], f = $('#fullAd');
  closeMenu();
  f.className = 'fullad ' + a.cls;
  f.innerHTML = `<span class="fa-tag">AD</span><button class="fa-close" disabled>Close in ${AD_WAIT}</button>
    <div class="fa-body"><div class="fa-ico">${a.ico}</div><h1>${a.title}</h1><p class="fa-sub">${a.sub}</p>${a.more || ''}
    <button class="fa-go">${a.btn}</button>${a.small ? `<div class="fa-small">${a.small}</div>` : ''}</div>`;
  f.hidden = false;
  f.querySelector('.fa-go').onclick = a.fn;
  const c = f.querySelector('.fa-close'); let n = AD_WAIT;
  const iv = setInterval(() => {
    if (f.hidden) return clearInterval(iv);
    if (--n <= 0) { clearInterval(iv); c.disabled = false; c.textContent = '✕ Close'; }
    else c.textContent = `Close in ${n}`;
  }, 1000);
  c.onclick = () => { if (!c.disabled) f.hidden = true; };
}
function startAds() { if (!adTimer) adTimer = setTimeout(adTick, 1500); }
function stopAds() { clearTimeout(adTimer); adTimer = null; $('#fullAd').hidden = true; }
// while an ad is up, keys don't reach the app (Esc closes it once Close is unlocked)
document.addEventListener('keydown', e => {
  if (!adOpen() || e.target.closest('.modalbg')) return;
  const c = $('#fullAd .fa-close');
  if (e.key === 'Escape' && c && !c.disabled) $('#fullAd').hidden = true;
  e.stopImmediatePropagation(); e.preventDefault();
}, true);
function openSkyAd() {
  smallModal('🏝️ My SkyBlock', `
    <p style="font-size:15px">My <b>new SkyBlock game</b> for Minecraft!</p>
    <p>🏝️ Get your <b>own island</b> floating in the sky, then warp to the <b>Hub</b>.</p>
    <p>⛏️ Level up skills, collect items, and build <b>minions</b> that work for you.</p>
    <p>🐾 Pets, ⚔️ slayer bosses, 💰 the Bazaar, Auction House and a Bank.</p>
    <p>🤝 Play with a friend on a co-op island.</p>
    <p style="color:var(--muted);font-size:12px">Needs Minecraft and the Mod Launcher.</p>`,
    'Play it ▶', () => { location.href = 'mcmod://my-skyblock'; });
}
function openBoxAd() {
  smallModal('🎩⚡ Electrical Box, Cards, and Button', `
    <p style="font-size:15px">A magic trick invention!</p>
    <p>🃏 Playing cards with <b>real little screens</b> that can change their face, switch their back color, or even turn <b>see-through</b>.</p>
    <p>📦 A box with a see-through window, an automatic lid, and a <b>card launcher</b> that flips the top card out of the box.</p>
    <p>🔘 A control panel of buttons runs it all.</p>
    <p><b>Coming soon!</b></p>`, 'Cool! 😎');
}

// 💛 Donate — just giving money, you don't get anything extra
function openDonate() {
  let amt = 5;
  const bg = smallModal('💛 Donate', `
    <p>Thank you! This is just a gift to help me make more apps and games — you don't get anything extra for it.</p>
    ${PAY.donate ? '' : `<div class="amts">${[1, 2, 5, 10, 20].map(n => `<button data-amt="${n}"${n === amt ? ' class="on"' : ''}>${money(n)}</button>`).join('')}</div>
    <label class="row">Other amount: $ <input class="money" type="number" min="1" step="1" placeholder="any amount"></label>`}
    <p style="color:var(--muted);font-size:12px">${PAY.donate ? '🔒 You\'ll choose how much on the safe Stripe page.' : '🧪 Test mode — no real money is sent yet. A grown-up needs to connect payments first.'}</p>`,
    'Donate 💛', () => {
      if (PAY.donate) { window.open(PAY.donate, '_blank', 'noopener'); return; }
      const other = +bg.querySelector('.money').value;
      toast(`💛 Thank you for donating ${money(other > 0 ? Math.round(other) : amt)}! (test mode — no real money)`);
    });
  bg.querySelectorAll('[data-amt]').forEach(b => b.onclick = () => {
    amt = +b.dataset.amt; bg.querySelector('.money').value = '';
    bg.querySelectorAll('[data-amt]').forEach(x => x.classList.toggle('on', x === b));
  });
}
$('#donateBtn').onclick = openDonate;
$('#pwDonate').onclick = openDonate;

// coming back from a real Stripe payment: ?paid=<plan id>
(() => {
  const q = new URLSearchParams(location.search), paid = q.get('paid');
  if (paid && planInfo(paid)) {
    let school = ''; try { school = localStorage.getItem('slideStudio.pendingSchool') || ''; localStorage.removeItem('slideStudio.pendingSchool'); } catch {}
    grantPlan(paid, school);
    history.replaceState(null, '', location.pathname);
  }
})();

/* ---------- start ---------- */
try { const j = localStorage.getItem(KEY); if (j) { deck = JSON.parse(j); if (!Array.isArray(deck.slides) || !deck.slides.length) throw 0; } else newDeck(); }
catch { newDeck(); }
commit(); fitStage(); renderAll(); applyPlan();
</script>
