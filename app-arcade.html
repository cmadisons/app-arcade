<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App Arcade</title>
<meta name="theme-color" content="#120a24">
<meta name="description" content="The recipe apps, the big apps and every minigame, on one page.">
<!-- The manifest and icons make this installable to a phone home screen.
     They live in the published repo, not in ~, so opening this file locally
     will 404 on them; that is harmless and only affects the local copy. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root { --bg:#120a24; --panel:#1e1238; --ink:#fff4d6; --dim:#b9a8d9; --neon:#ffd84a; --pink:#ff4fa0; --cyan:#4de8ff; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background: radial-gradient(circle at 50% -10%, #3a1a6a 0, var(--bg) 60%) fixed; color: var(--ink); font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 22px 16px 50px; }
  h1 { margin: 6px 0 2px; text-align:center; font-size: clamp(30px, 7vw, 54px); letter-spacing: 2px; color: var(--neon);
       text-shadow: 0 0 6px rgba(255,216,74,.8), 0 0 22px rgba(255,79,160,.6); }
  .sub { text-align:center; color: var(--dim); margin: 0 0 18px; }
  h2 { font-size: 15px; text-transform: uppercase; letter-spacing: 2px; color: var(--cyan); margin: 26px 0 10px; border-bottom: 2px solid rgba(77,232,255,.3); padding-bottom: 6px; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  a.tile { display:flex; flex-direction:column; text-decoration:none; color: var(--ink); background: var(--panel); border: 3px solid var(--c, #5a3a8a);
           box-shadow: 6px 6px 0 rgba(0,0,0,.45); transition: transform .12s, box-shadow .12s; aspect-ratio: 1 / 1; overflow:hidden; }
  a.tile:hover, a.tile:focus-visible { transform: translate(-2px,-2px); box-shadow: 8px 8px 0 rgba(0,0,0,.45), 0 0 18px var(--c); outline: none; }
  .pic { flex: 1 1 auto; min-height: 0; background: #000 center / cover no-repeat; border-bottom: 3px solid var(--c, #5a3a8a); }
  .txt { padding: 9px 11px 11px; }
  .txt b { display:block; font-size: 17px; }
  .txt span { display:block; font-size: 12.5px; color: var(--dim); margin-top: 2px; line-height: 1.3; }
  .tag { display:inline-block; margin-top: 6px; font-size: 10px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; background: var(--c); color:#120a24; padding: 1px 6px; }
  a.tile.hl { animation: hl 1s ease-in-out 4; }
  @keyframes hl { 50% { box-shadow: 0 0 0 5px var(--neon), 0 0 30px var(--neon); transform: scale(1.03); } }
  footer { text-align:center; color: var(--dim); font-size: 12px; margin-top: 30px; }
  /* Most of the minigames have no poster art, and painting fourteen of them
     was not the job. A tile with no picture shows its emoji instead, big, on
     its own colour -- which at tile size reads as well as a photo. */
  .pic.emoji { display:grid; place-items:center; font-size: 68px; line-height:1;
               background: radial-gradient(circle at 50% 35%, rgba(255,255,255,.14), transparent 60%); }
  .search { display:flex; gap:8px; align-items:center; justify-content:center; margin: 4px 0 18px; }
  .search input { flex: 0 1 420px; background: var(--panel); color: var(--ink); border: 3px solid #5a3a8a;
                  padding: 11px 13px; font-size: 15px; font-family: inherit; }
  .search input::placeholder { color: var(--dim); }
  .search input:focus { outline: none; border-color: var(--neon); }
  .search button { background: var(--panel); color: var(--dim); border: 3px solid #5a3a8a; padding: 11px 13px;
                   font: inherit; font-size: 15px; cursor: pointer; }
  .empty { text-align:center; color: var(--dim); padding: 20px 0; }
  h2.hide, .grid.hide { display: none; }
  @media (max-width: 560px) {
    .wrap { padding: 14px 12px 60px; }
    /* Two across on a phone rather than one: these tiles are square and a
       single column made the page a very long scroll for fourteen games. */
    .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
    .txt { padding: 7px 8px 9px; }
    .txt b { font-size: 14px; }
    .txt span { font-size: 11px; }
    .pic.emoji { font-size: 44px; }
    .search input, .search button { padding: 12px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🕹️ APP ARCADE</h1>
  <p class="sub">All the recipe apps, the big apps, and every minigame. Pick one to play.</p>
  <div class="search">
    <input id="q" type="search" placeholder="Search the arcade…" autocomplete="off" aria-label="Search the arcade">
    <button id="clear" type="button" title="Show everything again">Clear</button>
  </div>
  <h2 data-for="recipes">🍪 Recipe apps</h2>
  <div class="grid" id="recipes"></div>
  <h2 data-for="apps">📺 From the ads</h2>
  <div class="grid" id="apps"></div>
  <h2 data-for="games">🎮 Minigames</h2>
  <div class="grid" id="games"></div>
  <h2 data-for="mods">⛏️ Minecraft mods</h2>
  <div class="grid" id="mods"></div>
  <p class="empty hide" id="empty">Nothing matches that.</p>
  <footer>Tap a tile to open it. · <span id="visits"></span></footer>
</div>
<script>
var P = 'square-recipe-ads/poster-';
// On this computer the tiles open the local copies (and Minecraft); online they open the published pages.
var LOCAL = location.protocol === 'file:';
function at(local, web){ return LOCAL ? local : web; }
var RECIPES = [
  { id:'recipe', name:'Recipe Box', text:'Full recipes with double amounts, checkmarks, step timers and speaker mode.', url:'recipe-app.html#', pic: P + 'recipe.jpg', c:'#c98a4b' },
  { id:'square', name:'Square Recipe Box', text:'Every ingredient in the order you use it, and what you do with it.', url:'square-recipe-app.html', pic: P + 'square.jpg', c:'#e0a860' }
];
var APPS = [
  { id:'baseball', name:'All Live Baseball', text:'Live games, stats, playoffs, levels and the Baseball Pass.', url: at('all-live-baseball-site/index.html', 'https://cmadisons.github.io/all-live-baseball/'), pic: P + 'baseball.jpg', c:'#4d7cff' },
  { id:'hedgehog', name:'Whack-a-Hedgehog', text:'How fast can you whack them? Catch Sonic for a reward.', url: at('minigames/hedgehog.html', 'https://cmadisons.github.io/minigames/hedgehog.html'), pic: P + 'hedgehog.jpg', c:'#7ccf2a' },
  { id:'walkup', name:'Walk Up Songs', text:'Every player, and the song they walk up to.', url: at('walk-up-songs/index.html', 'https://cmadisons.github.io/walk-up-songs/'), pic: P + 'walkup.jpg', c:'#b36cf0' },
  { id:'reach', name:'Reach', text:'Everyone\'s account in one place \u2014 email, call, and keep the conversation.', url: at('reach/index.html', 'https://cmadisons.github.io/reach/'), em:'\uD83D\uDCDE', c:'#4de8ff' },
  { id:'lego', name:'LEGO Pic', text:'Drop in a photo and get it back as LEGO bricks.', url: at('lego-pic/index.html', 'https://cmadisons.github.io/lego-pic/'), pic: P + 'lego.jpg', c:'#ff4a3d' },
  { id:'ship', name:'Ship Life', text: at('Live on a giant space ship. Opens Minecraft with the Ship Life mod.', 'A Minecraft mod: live on a giant space ship. Opens the mod\'s page.'), url: at('mcmod://ship-life', 'https://github.com/cmadisons/ship-life'), pic: P + 'ship.jpg', c:'#ffd84a', tag: at('⛏️ Opens Minecraft', '⛏️ Minecraft mod') },
  { id:'zelda', name:'Zelda BOTW', text:'Wake up on the Great Plateau and explore Hyrule.', url: at('arcade/breath-of-the-wild/index.html', 'https://cmadisons.github.io/arcade/breath-of-the-wild/'), pic: P + 'zelda.jpg', c:'#4de8c0' },
  // Lives in this repo next to the recipe apps, so the one relative link works here and online.
  { id:'adbuilder', name:'Ad Builder', text:'Describe an ad. Thirty seconds later it is made, and it plays.', url:'ad-builder.html', em:'\uD83C\uDFAC', c:'#ff4fa0' }
];
// The minigames repo has fourteen games published and the arcade linked one
// of them. The rest are here now. No poster art for any of them, so each
// carries the emoji its own index page uses.
var G = function (local) { return at('minigames/' + local, 'https://cmadisons.github.io/minigames/' + local); };
var GAMES = [
  { id:'pacman',  name:'Pac-Man',        text:'Eat the dots, dodge the ghosts.',        url: G('pacman.html'),              em:'👾', c:'#ffd84a' },
  { id:'tetris',  name:'Tetris',         text:'Stack the blocks, clear the rows.',      url: G('tetris.html'),              em:'🧱', c:'#4de8ff' },
  { id:'snake',   name:'Snake',          text:"Eat, grow, don't crash.",                url: G('snake.html'),               em:'🐍', c:'#7ccf2a' },
  { id:'g2048',   name:'2048',           text:'Slide tiles, merge them up.',            url: G('2048.html'),                em:'🧮', c:'#e0a860' },
  { id:'chess',   name:'Chess',          text:'Three levels of computer.',              url: G('chess.html'),               em:'♟️', c:'#b9a8d9' },
  { id:'doodle',  name:'Doodle Jump',    text:"Bounce up, don't fall off.",             url: G('doodle-jump.html'),         em:'🦘', c:'#ff4fa0' },
  { id:'skyblk',  name:'Sky Blocks',     text:'Mine, fish and do jobs for Joe.',        url: G('skyblocks.html'),           em:'🏝️', c:'#4de8c0' },
  { id:'towerd',  name:'Tower Defense',  text:'Build towers, hold the road.',           url: G('tower-defense.html'),       em:'🏰', c:'#c98a4b' },
  { id:'runner',  name:'Gap Runner',     text:'Levels of holes, spikes and pipes.',     url: G('runner.html'),              em:'🏃', c:'#ff4a3d' },
  { id:'hexfall', name:'Hexagon Fall',   text:"Tap bricks, don't drop the hexagon.",    url: G('hexagon-fall.html'),        em:'⬡',  c:'#4d7cff' },
  { id:'memory',  name:'Memory Match',   text:'Flip and match the pairs.',              url: G('memory.html'),              em:'🧠', c:'#b36cf0' },
  { id:'rps',     name:'Rock Paper Scissors', text:'Beat the computer, best of luck.',  url: G('rock-paper-scissors.html'), em:'✊', c:'#ffd84a' },
  { id:'guess',   name:'Guess 1–100',    text:'Find the secret number.',                url: G('1-100.html'),               em:'🔢', c:'#4de8ff' },
  { id:'darts',   name:'Darts Counter',  text:'Keep score for a real game of darts.',   url: at('darts-counter/index.html', 'https://cmadisons.github.io/darts-counter/'), em:'🎯', c:'#7ccf2a' },
  { id:'times',   name:'TimesTanimals',  text:'The times tables, with animals.',        url:'https://www.timestanimals.com/', em:'🦁', c:'#ff4fa0' }
];
// The Fabric mods. On this computer they open Minecraft through the Mod
// Launcher; online they open the mod's page, since a web page cannot start
// Minecraft on somebody else's machine. Ship Life has poster art and stays
// up with the apps; these are the rest of them.
var M = function (folder, repo) { return at('mcmod://' + folder, 'https://github.com/cmadisons/' + repo); };
var MODTAG = at('⛏️ Opens Minecraft', '⛏️ Minecraft mod');
var MODS = [
  { id:'zeldamod',  name:'Zelda Mod',       text:'Hyrule in Minecraft: the items, the enemies and the shrines.', url: M('zelda-mod','zelda-mod'),             em:'🗡️', c:'#4de8c0', tag: MODTAG },
  { id:'skyblockmod', name:'SkyBlock Mod',  text:'Hypixel SkyBlock: a thousand items, 300 people, 131 enemies.', url: M('skyblock-mod','skyblock-mod'),       em:'🏝️', c:'#ffd84a', tag: MODTAG },
  { id:'rteleport', name:'Random Teleport', text:'Press G to jump somewhere random. Sheep in all 16 colours.',   url: M('random-teleport','random-teleport'), em:'🌀', c:'#b36cf0', tag: MODTAG },
  { id:'worlddl',   name:'World Downloader',text:'Save a multiplayer world to singleplayer as you walk it.',     url: M('world-downloader','world-downloader'), em:'💾', c:'#7ccf2a', tag: MODTAG },
  { id:'examplemod',name:'Example Mod',     text:'The first one. Where all the others started.',                 url: M('example-mod','example-mod'),         em:'🧪', c:'#ff4a3d', tag: MODTAG }
];

function tiles(list){
  return list.map(function(a){
    // A tile with poster art shows the photo; one without shows its emoji.
    var face = a.pic
      ? '<div class="pic" style="background-image:url(\'' + a.pic + '\')"></div>'
      : '<div class="pic emoji" style="background-color:' + a.c + '33">' + a.em + '</div>';
    return '<a class="tile" id="' + a.id + '" href="' + a.url + '"' + (/^https?:/.test(a.url) ? ' target="_blank" rel="noopener"' : '') + ' style="--c:' + a.c + '">' +
      face +
      '<div class="txt"><b>' + a.name + '</b><span>' + a.text + '</span>' + (a.tag ? '<i class="tag">' + a.tag + '</i>' : '') + '</div></a>';
  }).join('');
}
document.getElementById('recipes').innerHTML = tiles(RECIPES);
document.getElementById('apps').innerHTML = tiles(APPS);
document.getElementById('games').innerHTML = tiles(GAMES);
document.getElementById('mods').innerHTML = tiles(MODS);

/* ---- search -------------------------------------------------------------
   Thirty-odd tiles is more than you can scan, so the box filters on name and
   on the blurb -- "dots" finds Pac-Man, "minecraft" finds Ship Life. A
   heading whose whole grid is hidden hides too, so you do not get a row of
   empty section titles. */
var BOX = document.getElementById('q'), EMPTY = document.getElementById('empty');
function filter(){
  var want = BOX.value.trim().toLowerCase();
  var total = 0;
  document.querySelectorAll('a.tile').forEach(function(t){
    var hit = !want || t.textContent.toLowerCase().indexOf(want) >= 0;
    t.style.display = hit ? '' : 'none';
    if (hit) total++;
  });
  document.querySelectorAll('h2[data-for]').forEach(function(h){
    var grid = document.getElementById(h.dataset.for);
    var any = Array.prototype.some.call(grid.children, function(t){ return t.style.display !== 'none'; });
    h.classList.toggle('hide', !any);
    grid.classList.toggle('hide', !any);
  });
  EMPTY.classList.toggle('hide', total > 0);
}
BOX.addEventListener('input', filter);
document.getElementById('clear').addEventListener('click', function(){ BOX.value = ''; filter(); BOX.focus(); });

/* ---- how many times you have been here ----------------------------------
   Counted in this browser only. There is no server behind the arcade, so a
   real visitor count is not on offer; this is your own, which is the honest
   version of it. */
try {
  var n = (parseInt(localStorage.getItem('arcadeVisits'), 10) || 0) + 1;
  localStorage.setItem('arcadeVisits', n);
  document.getElementById('visits').textContent =
    n === 1 ? 'Your first visit.' : 'Your visit number ' + n + '.';
} catch (e) { }
document.querySelectorAll('a.tile[href^="mcmod:"]').forEach(function(t){
  t.addEventListener('click', function(){
    var tag = t.querySelector('.tag'); if (tag) tag.textContent = '⏳ Starting Minecraft… (about a minute)';
  });
});
// coming from an ad? light up that app's tile
var id = location.hash.replace('#', ''), t = id && document.getElementById(id);
if (t) { t.classList.add('hl'); t.scrollIntoView({ block: 'center' }); t.focus({ preventScroll: true }); }
</script>
</body></html>
