><td class=\"amt\">1 cup<\/td><td class=\"amt dbl\">2 cups<\/td><\/tr>\n  <tr><td>Water<span class=\"tip\">Heated with the milk (step 2)<\/span><\/td><td class=\"amt\">1 cup<\/td><td class=\"amt dbl\">2 cups<\/td><\/tr>\n  <tr><td>Brown sugar, packed<span class=\"tip\">Stirred in at the end (step 6)<\/span><\/td><td class=\"amt\">1 tbsp<\/td><td class=\"amt dbl\">2 tbsp<\/td><\/tr>\n  <tr><td>Vanilla<\/td><td class=\"amt\">¼ tsp<\/td><td class=\"amt dbl\">½ tsp<\/td><\/tr>\n  <tr><td>Salt<span class=\"tip\">Keeps it from tasting flat (step 2)<\/span><\/td><td class=\"amt\">tiny pinch<\/td><td class=\"amt dbl\">small pinch<\/td><\/tr>\n<\/table>\n\n<div class=\"cols\">\n  <div>\n    <h2>For Topping<\/h2>\n    <table>\n      <tr><th><\/th><th>2<\/th><th>4<\/th><\/tr>\n      <tr><td>Brown sugar<span class=\"tip\">Sprinkled on each bowl (step 8)<\/span><\/td><td class=\"amt\">1 tsp<\/td><td class=\"amt dbl\">2 tsp<\/td><\/tr>\n      <tr><td>Milk<span class=\"tip\">A splash on each bowl (step 8)<\/span><\/td><td class=\"amt\">2 tbsp<\/td><td class=\"amt dbl\">¼ cup<\/td><\/tr>\n    <\/table>\n  <\/div>\n  <div>\n    <h2>Optional Add-ins<\/h2>\n    <table>\n      <tr><th><\/th><th>2<\/th><th>4<\/th><\/tr>\n      <tr><td>Cinnamon<span class=\"tip\">Stirred in (step 6)<\/span><\/td><td class=\"amt\">¼ tsp<\/td><td class=\"amt dbl\">½ tsp<\/td><\/tr>\n      <tr><td>Blueberries<span class=\"tip\">Rinsed (step 5)<\/span><\/td><td class=\"amt\">½ cup<\/td><td class=\"amt dbl\">1 cup<\/td><\/tr>\n      <tr><td>Banana<span class=\"tip\">Sliced into coins (step 5)<\/span><\/td><td class=\"amt\">½ banana<\/td><td class=\"amt dbl\">1 banana<\/td><\/tr>\n      <tr><td>Honey<span class=\"tip\">If you add it, skip the topping brown sugar<\/span><\/td><td class=\"amt\">1 tbsp<\/td><td class=\"amt dbl\">2 tbsp<\/td><\/tr>\n      <tr><td>Peanut butter<span class=\"tip\">Stirred in (step 6)<\/span><\/td><td class=\"amt\">1 tbsp<\/td><td class=\"amt dbl\">2 tbsp<\/td><\/tr>\n    <\/table>\n  <\/div>\n<\/div>\n\n<h2>What You'll Need<\/h2>\n<div class=\"tip\">Set everything out before you start.<\/div>\n<ul class=\"tools\">\n  <li class=\"wide\"><span class=\"box\"><\/span><span><b>Cups:<\/b> <span class=\"sizes\">1 cup, ½ cup, ¼ cup<\/span><\/span><\/li>\n  <li class=\"wide\"><span class=\"box\"><\/span><span><b>Spoons:<\/b> <span class=\"sizes\">1 tbsp, 1 tsp, ½ tsp, ¼ tsp<\/span><\/span><\/li>\n  <li><span class=\"box\"><\/span>Small saucepan<\/li>\n  <li><span class=\"box\"><\/span>Wooden spoon<\/li>\n  <li><span class=\"box\"><\/span>Oven mitt<\/li>\n  <li><span class=\"box\"><\/span>Strainer (to rinse berries)<\/li>\n  <li><span class=\"box\"><\/span>Knife<\/li>\n  <li><span class=\"box\"><\/span>Cutting board<\/li>\n  <li><span class=\"box\"><\/span>Bowls<\/li>\n  <li><span class=\"box\"><\/span>Spoons for eating<\/li>\n<\/ul>\n\n<h2>Steps<\/h2>\n<div class=\"tip\">Making 4? Use the double amounts, a medium saucepan, and 4 bowls. Steps that say \"during\" happen at the same time as another step, so they don't add extra time.<\/div>\n<ol class=\"steps\">\n  <li><span class=\"dur\">⏱ 2 min<\/span><span class=\"txt\"><b>Measure everything.<\/b> Use <b>old-fashioned rolled oats<\/b>. Quick oats turn mushy, and steel-cut oats take 30 minutes. Measure the oats, milk, water, brown sugar and vanilla, and set them next to the stove.<\/span><\/li>\n  <li><span class=\"dur\">⏱ 4 min<\/span><span class=\"txt\"><b>Heat the milk and water.<\/b> Put the milk, water and a <b>tiny pinch of salt<\/b> in the small saucepan over <b>medium heat<\/b>. Heat until small bubbles pop around the edge. <b>Stay by the stove.<\/b> Milk can bubble over fast! If it starts to rise, lift the pan off the heat for a few seconds.<\/span><\/li>\n  <li><span class=\"dur\">⏱ 1 min<\/span><span class=\"txt\"><b>Stir in the oats.<\/b> Pour in the oats and stir. Turn the heat down to <b>medium-low<\/b> so it bubbles gently, not hard.<\/span><\/li>\n  <li><span class=\"dur\">⏱ 5 min<\/span><span class=\"txt\"><b>Cook and stir.<\/b> Stir <b>every minute<\/b>, scraping the bottom, so it doesn't stick or burn. It's done when the oats are soft and it looks <b>thick and creamy<\/b>.<\/span><\/li>\n  <li><span class=\"dur\">⏱ 3 min <i>(during step 4)<\/i><\/span><span class=\"txt\"><b>Optional: Get the toppings ready.<\/b> Rinse the blueberries in the strainer. Slice the banana into coins (careful with the knife!).<\/span><\/li>\n  <li><span class=\"dur\">⏱ 1 min<\/span><span class=\"txt\"><b>Flavor it.<\/b> Turn off the heat. Stir in the brown sugar and vanilla, plus cinnamon or peanut butter if you're using them.<\/span><\/li>\n  <li><span class=\"dur\">⏱ 2 min<\/span><span class=\"txt\"><b>Let it rest for 2 minutes.<\/b> Use the oven mitt to move the pan off the hot burner. It gets thicker as it sits. <b>Careful, it's hot!<\/b><\/span><\/li>\n  <li><span class=\"dur\">⏱ 1 min<\/span><span class=\"txt\"><b>Serve and eat!<\/b> Spoon it into the bowls. Sprinkle the topping brown sugar on top, add a splash of milk, and add blueberries, banana or honey if you like. Blow on each spoonful before you eat it!<\/span><\/li>\n<\/ol>\n\n<div class=\"boxes\">\n  <div class=\"note fix\"><b>🔧 Fix It<\/b>\n    <ul>\n      <li><b>Too thick?<\/b> Stir in 1–2 tbsp milk.<\/li>\n      <li><b>Too runny?<\/b> Let it rest 2 more minutes.<\/li>\n      <li><b>Stuck to the pan?<\/b> Turn the heat lower and stir more often.<\/li>\n    <\/ul>\n  <\/div>\n  <div class=\"note\"><b>Good to know:<\/b> The oats soak up the milk and water, and they keep getting thicker as they cool, so eat it warm. Leftovers keep 3 days in the fridge. Heat them up with a splash of milk.<\/div>\n  <div class=\"note allergy\"><b>⚠ Allergy note:<\/b> This porridge contains <b>milk<\/b>. The peanut butter add-in has <b>peanuts<\/b>. Oats can pick up bits of wheat, so use oats labeled <b>gluten-free<\/b> if someone can't eat gluten.<\/div>\n<\/div>", "single": "2 bowls", "double": "4 bowls", "total": "16 min", "noTimers": true}, {"id": "pasta", "theme": "pasta", "title": "Spaghetti with Tomato Sauce", "sub": "Twirly noodles in an easy homemade sauce", "facts": [["4", "servings"], ["27", "minutes"]], "pic": "<svg width=\"64\" height=\"64\" viewBox=\"0 0 200 200\" aria-hidden=\"true\" xmlns=\"http://www.w3.org/2000/svg\">\n  <ellipse cx=\"100\" cy=\"184\" rx=\"80\" ry=\"9\" fill=\"#5a2e14\" opacity=\".15\"/>\n  <!-- noodles -->\n  <ellipse cx=\"100\" cy=\"112\" rx=\"76\" ry=\"42\" fill=\"#f3d27e\"/>\n  <g fill=\"none\" stroke=\"#e2b24e\" stroke-width=\"5\" stroke-linecap=\"round\">\n    <path d=\"M36 118 C50 92 78 128 96 100 S140 124 160 98\"/>\n    <path d=\"M42 132 C62 110 86 142 108 116 S150 138 168 116\"/>\n    <path d=\"M58 94 C76 78 96 106 118 86 S150 100 150 86\"/>\n    <path d=\"M30 108 C40 96 60 104 70 92\"/>\n  <\/g>\n  <!-- sauce -->\n  <path d=\"M58 92 C62 70 92 62 110 68 C132 60 152 74 146 94 C154 110 128 120 110 114 C94 124 64 118 66 104 C54 102 54 96 58 92Z\" fill=\"#c8321f\"/>\n  <path d=\"M74 88 C82 78 98 76 106 80\" fill=\"none\" stroke=\"#e8634c\" stroke-width=\"5\" stroke-linecap=\"round\"/>\n  <circle cx=\"92\" cy=\"98\" r=\"4\" fill=\"#a3251a\"/><circle cx=\"122\" cy=\"92\" r=\"3.5\" fill=\"#a3251a\"/><circle cx=\"110\" cy=\"104\" r=\"3\" fill=\"#a3251a\"/>\n  <!-- parmesan -->\n  <g fill=\"#fff8e6\"><rect x=\"84\" y=\"84\" width=\"5\" height=\"3\" rx=\"1\"/><rect x=\"114\" y=\"80\" width=\"5\" height=\"3\" rx=\"1\" transform=\"rotate(30 116 81)\"/><rect x=\"100\" y=\"94\" width=\"5\" height=\"3\" rx=\"1\"/><rect x=\"128\" y=\"100\" width=\"5\" height=\"3\" rx=\"1\" transform=\"rotate(-20 130 101)\"/><rect x=\"76\" y=\"102\" width=\"5\" height=\"3\" rx=\"1\"/><\/g>\n  <!-- basil -->\n  <path d=\"M104 72 C112 60 128 60 132 66 C124 76 112 78 104 72Z\" fill=\"#3f8a3a\"/>\n  <path d=\"M104 72 C114 68 124 66 132 66\" fill=\"none\" stroke=\"#2c6a29\" stroke-width=\"2\"/>\n  <!-- bowl -->\n  <path d=\"M14 118 H186 C186 156 150 180 100 180 C50 180 14 156 14 118Z\" fill=\"#fff\" stroke=\"#e6d8c6\" stroke-width=\"3\"/>\n  <path d=\"M22 134 H178\" stroke=\"#d2462f\" stroke-width=\"6\" stroke-linecap=\"round\"/>\n<\/svg>", "body": "<div class=\"times\">\n  <div class=\"time\"><b>Boil:<\/b> 10 min<\/div><span class=\"plus\">+<\/span>\n  <div class=\"time\"><b>Simmer:<\/b> 12 min<\/div><span class=\"plus\">+<\/span>\n  <div class=\"time\"><b>Drain:<\/b> 2 min<\/div><span class=\"plus\">+<\/span>\n  <div class=\"time\"><b>Mix:<\/b> 2 min<\/div><span class=\"plus\">+<\/span>\n  <div class=\"time\"><b>Serve:<\/b> 1 min<\/div><span class=\"plus\">=<\/span>\n  <div class=\"time total\"><b>Total:<\/b> 27 min<\/div>\n<\/div>\n<div class=\"tip\">Boil = step 1 (steps 2–4 happen during it). Simmer = step 5 (steps 6–7 happen during it). Drain = step 8. Mix = step 9. Serve = step 10.<\/div>\n\n<h2>Main Ingredients<\/h2>\n<table class=\"main\">\n  <tr><th><\/th><th>4 servings<\/th><th>8 (double)<\/th><\/tr>\n  <tr><td>Spaghetti<span class=\"tip\">Any long pasta works (step 6)<\/span><\/td><td class=\"amt\">1 lb (16 oz)<\/td><td class=\"amt dbl\">2 lb (32 oz)<\/td><\/tr>\n  <tr><td>Crushed tomatoes<span class=\"tip\">One big can (step 5)<\/span><\/td><td class=\"amt\">1 can (28 oz)<\/td><td class=\"amt dbl\">2 cans (28 oz each)<\/td><\/tr>\n  <tr><td>Onion<span class=\"tip\">Chopped small (step 2)<\/span><\/td><td class=\"amt\">1 small<\/td><td class=\"amt dbl\">2 small<\/td><\/tr>\n  <tr><td>Garlic<span class=\"tip\">Chopped tiny (step 2)<\/span><\/td><td class=\"amt\">2 cloves<\/td><td class=\"amt dbl\">4 cloves<\/td><\/tr>\n  <tr><td>Olive oil<span class=\"tip\">For cooking the onion (step 3)<\/span><\/td><td class=\"amt\">2 tbsp<\/td><td class=\"amt dbl\">4 tbsp<\/td><\/tr>\n  <tr><td>Salt<span class=\"tip\">For the sauce (step 5)<\/span><\/td><td class=\"amt\">½ tsp<\/td><td class=\"amt dbl\">1 tsp<\/td><\/tr>\n  <tr><td>White sugar<span class=\"tip\">Takes the sour edge off the tomatoes (step 5)<\/span><\/td><td class=\"amt\">1 tsp<\/td><td class=\"amt dbl\">2 tsp<\/td><\/tr>\n  <tr><td>Dried basil<span class=\"tip\">For the sauce (step 5)<\/span><\/td><td class=\"amt\">1 tsp<\/td><td class=\"amt dbl\">2 tsp<\/td><\/tr>\n  <tr><td>Butter<span class=\"tip\">Makes the sauce shiny (step 9)<\/span><\/td><td class=\"amt\">1 tbsp<\/td><td class=\"amt dbl\">2 tbsp<\/td><\/tr>\n<\/table>\n\n<div class=\"cols\">\n  <div>\n    <h2>For Cooking &amp; Topping<\/h2>\n    <table>\n      <tr><th><\/th><th>4<\/th><th>8<\/th><\/tr>\n      <tr><td>Water<span class=\"tip\">In the big pot (step 1)<\/span><\/td><td class=\"amt\">4 quarts (16 cups)<\/td><td class=\"amt dbl\">8 quarts (2 pots)<\/td><\/tr>\n      <tr><td>Salt<span class=\"tip\">In the boiling water (step 6)<\/span><\/td><td class=\"amt\">1 tbsp<\/td><td class=\"amt dbl\">2 tbsp<\/td><\/tr>\n      <tr><td>Parmesan, grated<span class=\"tip\">On top (step 10)<\/span><\/td><td class=\"amt\">½ cup<\/td><td class=\"amt dbl\">1 cup<\/td><\/tr>\n    <\/table>\n  <\/div>\n  <div>\n    <h2>Optional Add-ins<\/h2>\n    <table>\n      <tr><th><\/th><th>4<\/th><th>8<\/th><\/tr>\n      <tr><td>Red pepper flakes<span class=\"tip\">For a little spice (step 4)<\/span><\/td><td class=\"amt\">¼ tsp<\/td><td class=\"amt dbl\">½ tsp<\/td><\/tr>\n      <tr><td>Cooked meatballs<span class=\"tip\">Warmed in the sauce (step 5). Thaw frozen ones first<\/span><\/td><td class=\"amt\">12<\/td><td class=\"amt dbl\">24<\/td><\/tr>\n      <tr><td>Fresh basil leaves<span class=\"tip\">Torn on top (step 10)<\/span><\/td><td class=\"amt\">8 leaves<\/td><td class=\"amt dbl\">16 leaves<\/td><\/tr>\n    <\/table>\n  <\/div>\n<\/div>\n\n<h2>What You'll Need<\/h2>\n<div class=\"tip\">Set everything out before you start.<\/div>\n<ul class=\"tools\">\n  <li class=\"wide\"><span class=\"box\"><\/span><span><b>Cups:<\/b> <span class=\"sizes\">½ cup<\/span><\/span><\/li>\n  <li class=\"wide\"><span class=\"box\"><\/span><span><b>Spoons:<\/b> <span class=\"sizes\">1 tbsp, 1 tsp, ½ tsp, ¼ tsp<\/span><\/span><\/li>\n  <li><span class=\"box\"><\/span>Big pot with a lid<\/li>\n  <li><span class=\"box\"><\/span>Medium saucepan<\/li>\n  <li><span class=\"box\"><\/span>Wooden spoon<\/li>\n  <li><span class=\"box\"><\/span>Tongs<\/li>\n  <li><span class=\"box\"><\/span>Cutting board<\/li>\n  <li><span class=\"box\"><\/span>Knife<\/li>\n  <li><span class=\"box\"><\/span>Can opener<\/li>\n  <li><span class=\"box\"><\/span>Colander<\/li>\n  <li><span class=\"box\"><\/span>Mug (to save pasta water)<\/li>\n  <li><span class=\"box\"><\/span>Cheese grater<\/li>\n  <li><span class=\"box\"><\/span>Oven mitts<\/li>\n  <li><span class=\"box\"><\/span>Plates or bowls<\/li>\n<\/ul>\n\n<h2>Steps<\/h2>\n<div class=\"tip\">Making 8? Use the double amounts, a big saucepan, and two big pots of water (4 quarts each) with 1 lb of spaghetti in each. Steps that say \"during\" happen at the same time as another step, so they don't add extra time.<\/div>\n<ol class=\"steps\">\n  <li><span class=\"dur\">⏱ 10 min<\/span><span class=\"txt\"><b>Boil the water.<\/b> Fill the big pot with <b>4 quarts of water<\/b>, put the lid on, and turn the burner to <b>high<\/b>. It's boiling when big bubbles roll all over the top. <b>Ask a grown-up to help with the stove.<\/b><\/span><\/li>\n  <li><span class=\"dur\">⏱ 4 min <i>(during step 1)<\/i><\/span><span class=\"txt\"><b>Chop the onion and garlic.<\/b> Peel the onion and cut it into <b>small pieces<\/b>. Peel the garlic and chop it <b>tiny<\/b>. Careful with the knife!<\/span><\/li>\n  <li><span class=\"dur\">⏱ 5 min <i>(during step 1)<\/i><\/span><span class=\"txt\"><b>Cook the onion.<\/b> Put the olive oil in the saucepan over <b>medium heat<\/b>. Add the onion and stir now and then until it is <b>soft and see-through<\/b>.<\/span><\/li>\n  <li><span class=\"dur\">⏱ 1 min <i>(during step 1)<\/i><\/span><span class=\"txt\"><b>Add the garlic.<\/b> Stir it in for <b>1 minute<\/b> until it smells good. Add the red pepper flakes now if you're using them. <b>Don't let it turn brown<\/b>, or it tastes bitter.<\/span><\/li>\n  <li><span class=\"dur\">⏱ 12 min<\/span><span class=\"txt\"><b>Simmer the sauce.<\/b> Open the can and pour in the tomatoes. Stir in the salt, sugar and dried basil, plus the meatballs if you're using them. When it bubbles, turn the heat to <b>low<\/b> and stir every few minutes. <b>Careful, sauce can splatter!<\/b><\/span><\/li>\n  <li><span class=\"dur\">⏱ 1 min <i>(during step 5)<\/i><\/span><span class=\"txt\"><b>Add the spaghetti.<\/b> The water should be boiling now. Take off the lid, add <b>1 tbsp salt<\/b>, then the spaghetti. Push it under the water with the wooden spoon as it softens.<\/span><\/li>\n  <li><span class=\"dur\">⏱ 11 min <i>(during step 5)<\/i><\/span><span class=\"txt\"><b>Cook the spaghetti.<\/b> Leave the lid off and <b>stir every few minutes<\/b> so it doesn't stick together. Check the box, since most spaghetti takes 9–11 minutes. Taste a piece: it's done when it's <b>soft but still a little chewy<\/b>.<\/span><\/li>\n  <li><span class=\"dur\">⏱ 2 min<\/span><span class=\"txt\"><b>Save some water, then drain.<\/b> Scoop out <b>½ cup of the pasta water<\/b> with a mug first. Then a grown-up pours the pot into the colander in the sink. <b>The steam is very hot!<\/b><\/span><\/li>\n  <li><span class=\"dur\">⏱ 2 min<\/span><span class=\"txt\"><b>Mix.<\/b> Put the spaghetti back in the empty pot. Add the sauce and butter and <b>toss with tongs<\/b> until every noodle is red. Too thick? Add a splash of the pasta water.<\/span><\/li>\n  <li><span class=\"dur\">⏱ 1 min<\/span><span class=\"txt\"><b>Serve!<\/b> Twirl the spaghetti onto plates with the tongs. Sprinkle the <b>Parmesan<\/b> on top, plus torn basil if you like, and <b>eat it right away!<\/b><\/span><\/li>\n<\/ol>\n\n<div class=\"boxes\">\n  <div class=\"note fix\"><b>🔧 Fix It<\/b>\n    <ul>\n      <li><b>Sauce too sour?<\/b> Stir in 1 more tsp sugar.<\/li>\n      <li><b>Sauce too thick?<\/b> Stir in a splash of the pasta water.<\/li>\n      <li><b>Sauce too thin?<\/b> Simmer 5 more minutes with no lid.<\/li>\n      <li><b>Spaghetti stuck together?<\/b> Toss it with the sauce right after draining. Don't rinse it.<\/li>\n    <\/ul>\n  <\/div>\n  <div class=\"note\"><b>Good to know:<\/b> Salty water makes the spaghetti itself taste good. Don't put oil in the water, or the sauce slides off. The starchy pasta water helps the sauce stick. Leftovers keep 3 days in the fridge.<\/div>\n  <div class=\"note allergy\"><b>⚠ Allergy note:<\/b> This pasta contains <b>wheat and milk<\/b> (butter and Parmesan). No peanuts. Most dry spaghetti has no egg, but check the box. For no milk, use olive oil instead of butter and skip the Parmesan.<\/div>\n<\/div>", "single": "4 servings", "double": "8 servings", "total": "27 min", "noTimers": true}, {"id": "muffins", "theme": "muffin", "title": "Muffins", "sub": "Soft and fluffy, with chocolate chips, blueberries or carrots", "facts": [["12", "muffins"], ["375°F", "190°C"]], "pic": "<svg width=\"64\" height=\"64\" viewBox=\"0 0 64 64\" aria-hidden=\"true\">\n  <path d=\"M14 34 L50 34 L45 58 Q44.6 60 42.6 60 L21.4 60 Q19.4 60 19 58 Z\" fill=\"#b388d9\"/>\n  <g stroke=\"#8a5cb8\" stroke-width=\"1.6\"><line x1=\"22\" y1=\"35\" x2=\"24.5\" y2=\"59\"/><line x1=\"29\" y1=\"35\" x2=\"30\" y2=\"59\"/><line x1=\"35\" y1=\"35\" x2=\"34\" y2=\"59\"/><line x1=\"42\" y1=\"35\" x2=\"39.5\" y2=\"59\"/><\/g>\n  <path d=\"M11 35 Q9 22 20 18 Q24 8 34 10 Q44 8 47 17 Q57 21 53 35 Z\" fill=\"#e0b070\"/>\n  <path d=\"M15 30 Q20 24 27 27 Q33 22 40 26 Q46 23 50 29\" stroke=\"#c9924a\" stroke-width=\"1.6\" fill=\"none\"/>\n  <g fill=\"#3b5ba8\"><circle cx=\"22\" cy=\"23\" r=\"2.6\"/><circle cx=\"37\" cy=\"17\" r=\"2.4\"/><circle cx=\"44\" cy=\"26\" r=\"2.6\"/><circle cx=\"30\" cy=\"29\" r=\"2.2\"/><\/g>\n  <g fill=\"#fffaf0\"><rect x=\"27\" y=\"16\" width=\"2\" height=\"1.4\" rx=\".5\"/><rect x=\"40\" y=\"21\" width=\"2\" height=\"1.4\" rx=\".5\"/><rect x=\"17\" y=\"28\" width=\"2\" height=\"1.4\" rx=\".5\"/><\/g>\n<\/svg>", "body": "<div class=\"times\">\n  <div class=\"time\"><b>Prep:<\/b> 15 min<\/div><span class=\"plus\">+<\/span>\n  <div class=\"time\"><b>Bake:<\/b> 20–22 min<\/div><span class=\"plus\">+<\/span>\n  <div class=\"time\"><b>Cool:<\/b> 15 min<\/div><span class=\"plus\">=<\/span>\n  <div class=\"time total\"><b>Total:<\/b> about 50–52 min<\/div>\n<\/div>\n<div class=\"tip\">Prep = steps 1–7. Bake = step 8. Cool = step 9. The oven heats up during steps 2–7, so it doesn't add extra time.<\/div>\n\n<h2>Main Ingredients<\/h2>\n<table class=\"main\">\n  <tr><th><\/th><th>12 muffins<\/th><th>24 (double)<\/th><\/tr>\n  <tr><td>Flour<span class=\"tip\">Spoon it in, then scrape off the top (step 3)<\/span><\/td><td class=\"amt\">2 cups<\/td><td class=\"amt dbl\">4 cups<\/td><\/tr>\n  <tr><td>White sugar<\/td><td class=\"amt\">¾ cup<\/td><td class=\"amt dbl\">1½ cups<\/td><\/tr>\n  <tr><td>Baking powder<\/td><td class=\"amt\">2 tsp<\/td><td class=\"amt dbl\">4 tsp<\/td><\/tr>\n  <tr><td>Salt<\/td><td class=\"amt\">½ tsp<\/td><td class=\"amt dbl\">1 tsp<\/td><\/tr>\n  <tr><td>Butter, melted<span class=\"tip\">Melted, then cooled a little (step 2)<\/span><\/td><td class=\"amt\">½ cup (1 stick)<\/td><td class=\"amt dbl\">1 cup (2 sticks)<\/td><\/tr>\n  <tr><td>Eggs<\/td><td class=\"amt\">2 large<\/td><td class=\"amt dbl\">4 large<\/td><\/tr>\n  <tr><td>Milk<\/td><td class=\"amt\">1 cup<\/td><td class=\"amt dbl\">2 cups<\/td><\/tr>\n  <tr><td>Vanilla<\/td><td class=\"amt\">1 tsp<\/td><td class=\"amt dbl\">2 tsp<\/td><\/tr>\n<\/table>\n\n<div class=\"cols\">\n  <div>\n    <h2>For Topping<\/h2>\n    <table>\n      <tr><th><\/th><th>12<\/th><th>24<\/th><\/tr>\n      <tr><td>White sugar<span class=\"tip\">Sprinkled on top (step 7)<\/span><\/td><td class=\"amt\">1 tbsp<\/td><td class=\"amt dbl\">2 tbsp<\/td><\/tr>\n    <\/table>\n  <\/div>\n  <div>\n    <h2>Optional Add-ins<\/h2>\n    <div class=\"tip\">Pick one or mix them. Up to 1 cup total (12) or 2 cups (24).<\/div>\n    <table>\n      <tr><th><\/th><th>12<\/th><th>24<\/th><\/tr>\n      <tr><td>Chocolate chips<\/td><td class=\"amt\">1 cup<\/td><td class=\"amt dbl\">2 cups<\/td><\/tr>\n      <tr><td>Blueberries<span class=\"tip\">Fresh or frozen. Don't thaw frozen ones (step 6)<\/span><\/td><td class=\"amt\">1 cup<\/td><td class=\"amt dbl\">2 cups<\/td><\/tr>\n      <tr><td>Carrot pieces, shredded small<span class=\"tip\">Small holes on the grater (step 6)<\/span><\/td><td class=\"amt\">1 cup<\/td><td class=\"amt dbl\">2 cups<\/td><\/tr>\n      <tr><td>Cinnamon<span class=\"tip\">Tastes great with carrots (step 3)<\/span><\/td><td class=\"amt\">½ tsp<\/td><td class=\"amt dbl\">1 tsp<\/td><\/tr>\n    <\/table>\n  <\/div>\n<\/div>\n\n<h2>What You'll Need<\/h2>\n<div class=\"tip\">Set everything out before you start.<\/div>\n<ul class=\"tools\">\n  <li class=\"wide\"><span class=\"box\"><\/span><span><b>Cups:<\/b> <span class=\"sizes\">1 cup, ½ cup, ¼ cup<\/span> · <b>Spoons:<\/b> <span class=\"sizes\">1 tbsp, 1 tsp, ½ tsp<\/span><\/span><\/li>\n  <li><span class=\"box\"><\/span>Muffin pan (12 cups)<\/li>\n  <li><span class=\"box\"><\/span>12 paper liners<\/li>\n  <li><span class=\"box\"><\/span>Big bowl<\/li>\n  <li><span class=\"box\"><\/span>Medium bowl<\/li>\n  <li><span class=\"box\"><\/span>Small bowl (for blueberries)<\/li>\n  <li><span class=\"box\"><\/span>Microwave-safe bowl<\/li>\n  <li><span class=\"box\"><\/span>Whisk<\/li>\n  <li><span class=\"box\"><\/span>Rubber spatula<\/li>\n  <li><span class=\"box\"><\/span>Knife (to level flour)<\/li>\n  <li><span class=\"box\"><\/span>Grater (for carrots)<\/li>\n  <li><span class=\"box\"><\/span>Toothpick<\/li>\n  <li><span class=\"box\"><\/span>Oven mitts<\/li>\n  <li><span class=\"box\"><\/span>Cooling rack<\/li>\n<\/ul>\n\n<h2>Steps<\/h2>\n<div class=\"tip\">Making 24? Use the double amounts and fill 24 liners. Bake one pan at a time unless both fit side by side on the middle rack. A second pan adds another 20–22 min.<\/div>\n<ol class=\"steps\">\n  <li><span class=\"dur\">⏱ 1 min<\/span><span class=\"txt\"><b>Turn on the oven.<\/b> Move the oven rack to the middle and turn the oven to <b>375°F<\/b>. Put paper liners in all 12 muffin cups. The oven takes about <b>15 minutes<\/b> to heat while you do steps 2–7. If it hasn't beeped by step 8, wait for it.<\/span><\/li>\n  <li><span class=\"dur\">⏱ 2 min<\/span><span class=\"txt\"><b>Melt the butter.<\/b> Put it in a microwave-safe bowl. Microwave <b>30 seconds<\/b>, then <b>15 seconds<\/b> at a time until melted. Set it aside to cool a little so it doesn't cook the eggs. <b>Careful, it gets hot!<\/b><\/span><\/li>\n  <li><span class=\"dur\">⏱ 3 min<\/span><span class=\"txt\"><b>Mix the dry stuff.<\/b> <b>Spoon the flour into the cup, then scrape off the top with a knife.<\/b> Scooping from the bag packs in too much and makes dry muffins. In the big bowl, whisk together the flour, sugar, baking powder and salt, plus cinnamon if you're using it. Using blueberries? Scoop <b>1 tbsp<\/b> of this dry mix into the small bowl and toss the blueberries in it so they don't sink.<\/span><\/li>\n  <li><span class=\"dur\">⏱ 3 min<\/span><span class=\"txt\"><b>Mix the wet stuff.<\/b> In the medium bowl, whisk the eggs, milk, melted butter and vanilla until smooth.<\/span><\/li>\n  <li><span class=\"dur\">⏱ 1 min<\/span><span class=\"txt\"><b>Combine.<\/b> Pour the wet mix into the dry mix. Stir with the spatula <b>just until you can't see dry flour.<\/b> Lumps are OK! Stirring too much makes the muffins tough.<\/span><\/li>\n  <li><span class=\"dur\">⏱ 2 min<\/span><span class=\"txt\"><b>Fold in your add-ins.<\/b> Gently stir in the chocolate chips, blueberries or carrot pieces with only a few stirs. Put frozen blueberries in straight from the freezer so the batter doesn't turn purple.<\/span><\/li>\n  <li><span class=\"dur\">⏱ 3 min<\/span><span class=\"txt\"><b>Fill the cups.<\/b> Scoop the batter into the liners until each one is about <b>¾ full<\/b> (a heaping ¼ cup). Sprinkle a little sugar on top of each one.<\/span><\/li>\n  <li><span class=\"dur\">⏱ 20–22 min<\/span><span class=\"txt\"><b>Bake on the middle rack for 20–22 minutes.<\/b> They're done when the tops are golden and spring back when you touch them lightly. A toothpick poked in the middle should come out clean. Melted chocolate on it is fine. <b>Use oven mitts!<\/b><\/span><\/li>\n  <li><span class=\"dur\">⏱ 15 min to cool<\/span><span class=\"txt\"><b>Cool, then eat!<\/b> 5 minutes in the pan, then 10 on the cooling rack. Hot muffins stick to the liners and fall apart.<\/span><\/li>\n<\/ol>\n\n<div class=\"boxes\">\n  <div class=\"note fix\"><b>🔧 Fix It<\/b>\n    <ul>\n      <li><b>Flat or tough?<\/b> The batter got stirred too much. Stir just until the flour is gone.<\/li>\n      <li><b>Blueberries sank?<\/b> Toss them in the dry mix first (step 3).<\/li>\n      <li><b>Middles still wet?<\/b> Bake 2–3 more minutes and check again.<\/li>\n      <li><b>Tops too dark?<\/b> Check that the rack is in the middle.<\/li>\n    <\/ul>\n  <\/div>\n  <div class=\"note\"><b>Good to know:<\/b> Baking powder makes the muffins rise. A lumpy batter makes fluffy muffins. Shred the carrots small, because big chunks stay hard.<\/div>\n  <div class=\"note allergy\"><b>⚠ Allergy note:<\/b> These muffins contain <b>egg, milk and wheat<\/b>. Chocolate chips can have milk and soy. Check with friends before sharing, and ask before bringing them to school.<\/div>\n<\/div>", "single": "12 muffins", "double": "24 muffins", "total": "about 50–52 min"}]</script>
<script>
(function(){
  var DATA = JSON.parse(document.getElementById('data').textContent);
  var app = document.getElementById('app');
  function load(key, def){ try { var v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch(e){ return def; } }
  function save(key, val){ try { localStorage.setItem(key, JSON.stringify(val)); } catch(e){} }

  var timers = {};  // "recipe:step" -> {end, iv}
  var audioCtx = null;
  function beep(){
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.35, 0.7].forEach(function(t){
        var o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
        g.gain.setValueAtTime(0.25, audioCtx.currentTime + t);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + t + 0.3);
        o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + 0.3);
      });
    } catch(e){}
  }
  function toast(msg){
    var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
    document.body.appendChild(t); setTimeout(function(){ t.remove(); }, 6000);
  }
  function fmt(s){ var m = Math.floor(s/60), r = s % 60; return m + ':' + (r < 10 ? '0' : '') + r; }

  // 💎 Premium recipes: only people with Premium (bought in any arcade app's ⭐ Upgrade store) see these
  var PREMIUM_IDS = ['porridge', 'pasta', 'muffins'];
  function isPremium(){ try { return +localStorage.getItem('squarebox:premiumUntil') > Date.now(); } catch(e){ return false; } }
  function visible(){ var p = isPremium(); return DATA.filter(function(r){ return p || PREMIUM_IDS.indexOf(r.id) < 0; }); }

  function home(){
    document.title = 'Recipe Box';
    app.className = 'wrap home';
    var locked = isPremium() ? '' : '<li class="t-prem-lock"><a href="#" data-store="1">🔒 💎 Premium recipes<span class="lockrow">' +
      DATA.filter(function(r){ return PREMIUM_IDS.indexOf(r.id) >= 0; }).map(function(r){ return r.title; }).join(' · ') + '</span></a></li>';
    app.innerHTML = '<h1>Recipe Box</h1><ul class="names">' + visible().map(function(r){
      return '<li class="t-' + r.theme + '"><a href="#' + r.id + '">' + r.title + (PREMIUM_IDS.indexOf(r.id) >= 0 ? ' <span class="prembadge">💎 Premium</span>' : '') + '</a></li>';
    }).join('') + locked + '</ul>';
    var lk = app.querySelector('[data-store]');
    if (lk) lk.addEventListener('click', function(e){ e.preventDefault(); if (window.appArcadeOpenStore) window.appArcadeOpenStore(); });
  }

  function recipe(r){
    document.title = r.title + ' · Recipe Box';
    app.className = 'wrap t-' + r.theme;
    var key = 'recipebox:' + r.id;
    var st = load(key, { got: [], tools: [], done: [], view: 'both' });
    var h = '<button class="back" data-act="home">← All recipes</button>' +
      '<div class="hero"><div class="pic">' + r.pic + '</div><div class="ttl"><h1>' + r.title + '</h1><div class="sub">' + r.sub + '</div></div>' +
      '<div class="facts">' + r.facts.map(function(f){ return '<div class="fact"><b>' + f[0] + '</b><span>' + f[1] + '</span></div>'; }).join('') + '</div></div>' +
      '<div class="toolbar"><div class="seg" role="group" aria-label="Amounts">' +
        '<button data-view="single">' + r.single + '</button><button data-view="double">' + r.double + '</button><button data-view="both">Both</button></div>' +
        '<span><button class="spk" data-act="speaker">🔊 Speaker mode</button> <button class="reset" data-act="reset">↺ Reset checkmarks</button></span></div>' +
      r.body;
    app.innerHTML = h;

    // amounts toggle
    function setView(v){
      st.view = v; save(key, st);
      app.querySelectorAll('.seg button').forEach(function(b){ b.classList.toggle('on', b.dataset.view === v); });
      app.querySelectorAll('table').forEach(function(t){ t.classList.toggle('show-single', v === 'single'); t.classList.toggle('show-double', v === 'double'); });
    }
    setView(st.view);

    // ingredient rows
    app.querySelectorAll('table tr').forEach(function(tr, i){
      if (tr.querySelector('th')) return;
      tr.classList.add('row');
      if (st.got.indexOf(i) >= 0) tr.classList.add('got');
      tr.addEventListener('click', function(){
        tr.classList.toggle('got');
        var k = st.got.indexOf(i); if (k >= 0) st.got.splice(k, 1); else st.got.push(i);
        save(key, st);
      });
    });
    // tools
    app.querySelectorAll('.tools li').forEach(function(li, i){
      if (st.tools.indexOf(i) >= 0) li.classList.add('got');
      li.addEventListener('click', function(){
        li.classList.toggle('got');
        var k = st.tools.indexOf(i); if (k >= 0) st.tools.splice(k, 1); else st.tools.push(i);
        save(key, st);
      });
    });
    // steps + timers
    app.querySelectorAll('ol.steps > li').forEach(function(li, i){
      if (st.done.indexOf(i) >= 0) li.classList.add('done');
      li.addEventListener('click', function(e){
        if (e.target.closest('.tbtn')) return;
        li.classList.toggle('done');
        var k = st.done.indexOf(i); if (k >= 0) st.done.splice(k, 1); else st.done.push(i);
        save(key, st);
      });
      var dur = li.querySelector('.dur'); if (!dur || r.noTimers) return;
      var m = dur.textContent.match(/(\d+)\s*(?:–\d+\s*)?min/);
      if (!m) return;
      var mins = parseInt(m[1], 10), id = r.id + ':' + i;
      var btn = document.createElement('button'); btn.className = 'tbtn'; btn.type = 'button';
      dur.appendChild(btn);
      function paint(){
        var t = timers[id];
        if (!t) { btn.className = 'tbtn'; btn.textContent = '▶ Start'; btn.title = 'Start a ' + mins + ' minute timer'; return; }
        if (t.ringing) { btn.className = 'tbtn ring'; btn.textContent = '⏰ Done!'; btn.title = 'Stop'; return; }
        var left = Math.max(0, Math.round((t.end - Date.now()) / 1000));
        btn.className = 'tbtn run'; btn.textContent = '■ ' + fmt(left); btn.title = 'Stop timer';
      }
      btn.addEventListener('click', function(){
        var t = timers[id];
        if (t) { clearInterval(t.iv); clearInterval(t.ringIv); delete timers[id]; paint(); return; }
        t = timers[id] = { end: Date.now() + mins * 60000 };
        beep(); // unlock audio with the tap
        t.iv = setInterval(function(){
          if (!document.body.contains(btn)) { return; }
          if (Date.now() >= t.end && !t.ringing) {
            t.ringing = true; clearInterval(t.iv); beep();
            t.ringIv = setInterval(beep, 3000);
            var stepName = (li.querySelector('b') || li).textContent.replace(/\s+/g, ' ').trim();
            toast('⏰ Time is up: step ' + (i + 1) + ', ' + stepName);
          }
          paint();
        }, 500);
        paint();
      });
      paint();
    });

    app.onclick = function(e){
      var v = e.target.closest('[data-view]'); if (v) setView(v.dataset.view);
      var a = e.target.closest('[data-act]'); if (!a) return;
      if (a.dataset.act === 'home') { location.hash = ''; }
      if (a.dataset.act === 'speaker') { if (speaker) stopSpeaker(); else startSpeaker(r, function(){ return st.view; }); }
      if (a.dataset.act === 'reset') { st = { got: [], tools: [], done: [], view: st.view }; save(key, st); app.querySelectorAll('.got,.done').forEach(function(x){ x.classList.remove('got','done'); }); }
   };
  }


  // ================= Speaker mode =================
  var speaker = null;
  var CPS = 14; // estimated characters spoken per second

  var FRAC_AND = { '½':'a half', '¼':'a quarter', '¾':'three quarters', '⅛':'an eighth' };
  var FRAC_ALONE = { '½':'half a', '¼':'a quarter', '¾':'three quarters of a', '⅛':'an eighth of a' };
  var UNITS = { tbsp:['tablespoon','tablespoons'], tsp:['teaspoon','teaspoons'], min:['minute','minutes'], hr:['hour','hours'], oz:['ounce','ounces'], lb:['pound','pounds'] };
  function sayable(t){
    t = String(t)
      .replace(/[⏱⚠🔧🍓🍋🍪↺▶■]/gu, '')
      .replace(/\s*\((?:steps? [\d–\-, ]+)\)/g, '')
      .replace(/(\d+)\s*[–-]\s*(\d+)/g, '$1 to $2')
      .replace(/°F/g, ' degrees Fahrenheit').replace(/°C/g, ' degrees Celsius')
      .replace(/(\d*)([½¼¾⅛]?)\s*(tbsp|tsp|min|hr|oz|lb)\b/g, function(all, n, f, u){
        if (!n && !f) return UNITS[u][1];
        var one = (n === '1' && !f) || (!n && f);
        var num = n ? n + (f ? ' and ' + FRAC_AND[f] : '') : FRAC_ALONE[f];
        return num + ' ' + UNITS[u][one ? 0 : 1];
      })
      .replace(/(\d+)([½¼¾⅛])/g, function(a, n, f){ return n + ' and ' + FRAC_AND[f]; })
      .replace(/([½¼¾⅛])\s*(cup|stick|banana|lemon)\b/g, function(a, f, w){ return FRAC_ALONE[f] + ' ' + w; })
      .replace(/[½¼¾⅛]/g, function(f){ return FRAC_AND[f]; })
      .replace(/tablespoons cookie scoop/g, 'tablespoon cookie scoop')
      .replace(/\((\d+)\)/g, 'for $1')
      .replace(/\s*=\s*/g, ' is ').replace(/\s*\+\s*/g, ' plus ').replace(/\s*·\s*/g, '. ')
      .replace(/\s+/g, ' ').trim();
    return t;
  }
  function sentences(text){
    return sayable(text).split(/(?<=[.!?])\s+/).filter(function(x){ return x.trim(); });
  }
  function ownText(el){
    var c = el.cloneNode(true);
    c.querySelectorAll('.tip, .tbtn').forEach(function(x){ x.remove(); });
    return c.textContent.replace(/\s+/g, ' ').trim();
  }
  function end(t){ t = t.trim(); return /[.!?]$/.test(t) ? t : t + '.'; }

  // everything between an h2 and the next h2 (or an element that holds one)
  function blockAfter(h2){
    var els = [h2], n = h2.nextElementSibling;
    while (n && n.tagName !== 'H2' && !n.querySelector('h2')) { els.push(n); n = n.nextElementSibling; }
    return els;
  }

  function buildSections(r, viewFn){
    var out = [];
    function add(title, short, lines, els){
      var sents = []; lines.forEach(function(l){ sents = sents.concat(sentences(l)); });
      if (!sents.length) return;
      out.push({ title: title, short: short, sents: sents, els: els.filter(Boolean),
                 chars: sents.reduce(function(a, x){ return a + x.length + 1; }, 0) });
    }
    var h2s = Array.prototype.slice.call(app.querySelectorAll('h2'));
    function findH2(re){ return h2s.filter(function(h){ return re.test(h.textContent); }); }

    // 1. How long it takes
    var tl = [end(r.title), 'Here is how long everything takes.'], tEls = [];
    app.querySelectorAll('.times').forEach(function(row, i){
      var bits = [];
      Array.prototype.forEach.call(row.children, function(c){
        var t = c.textContent.trim();
        if (c.classList.contains('plus')) { if (t === '+') bits.push(', plus '); else if (t === '=') bits.push(', equals '); else bits.push(t + ' '); }
        else bits.push(t);
      });
      tl.push(end(bits.join('').replace(/\s+,/g, ',')));
      tEls.push(row);
    });
    var legend = tEls.length && tEls[tEls.length - 1].nextElementSibling;
    if (legend && legend.classList.contains('tip')) { tl.push(legend.textContent); tEls.push(legend); }
    add('How long it takes', 'Times', tl, tEls);

    // 2-4. Ingredients / Optional Add-ins / What You'll Need
    function tableLines(els){
      var view = viewFn(), lines = [];
      els.forEach(function(el){
        (el.tagName === 'TABLE' ? [el] : Array.prototype.slice.call(el.querySelectorAll ? el.querySelectorAll('table') : [])).forEach(function(tb){
          tb.querySelectorAll('tr').forEach(function(tr){
            var tds = tr.querySelectorAll('td'); if (!tds.length) return;
            var name = ownText(tds[0]), tip = tds[0].querySelector('.tip');
            var single = tr.querySelector('td.amt:not(.dbl)'), dbl = tr.querySelector('td.dbl');
            var one = single.textContent.trim(), two = dbl.textContent.trim();
            var amt = view === 'double' ? two : view === 'single' || one === two ? one : one + ', or ' + two + ' for ' + r.double;
            lines.push(end(name + ': ' + amt));
            if (tip) lines.push(end(tip.textContent));
          });
        });
      });
      return lines;
    }
    var ing = findH2(/ingredients/i)[0], roll = findH2(/rolling|topping/i)[0];
    if (ing) {
      var els = blockAfter(ing).concat(roll ? blockAfter(roll) : []);
      var lines = function(){ var l = ['Ingredients.'].concat(tableLines(blockAfter(ing))); if (roll) l = l.concat([end(roll.textContent.replace(/&/g, 'and'))], tableLines(blockAfter(roll))); return l; };
      add('Ingredients', 'Ingredients', lines(), els);
      out[out.length - 1].rebuild = lines;
    }
    var opt = findH2(/optional/i)[0];
    if (opt) {
      var ol = function(){ return ['Optional add-ins.'].concat(tableLines(blockAfter(opt))); };
      add('Optional Add-ins', 'Add-ins', ol(), blockAfter(opt));
      out[out.length - 1].rebuild = ol;
    }
    var need = findH2(/need/i)[0];
    if (need) {
      var nl = ["What you'll need."], group = [];
      blockAfter(need).forEach(function(el){
        if (el.classList && el.classList.contains('tip')) nl.push(el.textContent);
        if (el.tagName === 'UL') el.querySelectorAll('li').forEach(function(li){
          var t = li.textContent.replace(/\s+/g, ' ').trim();
          if (li.classList.contains('wide')) nl.push(end(t)); else group.push(t);
        });
      });
      for (var i = 0; i < group.length; i += 5) nl.push(end(group.slice(i, i + 5).join(', ')));
      add("What You'll Need", 'Need', nl, blockAfter(need));
    }

    // 5. Each step: the step, then how long it takes
    app.querySelectorAll('ol.steps > li').forEach(function(li, i){
      var txt = li.querySelector('.txt'), dur = li.querySelector('.dur');
      var lines = ['Step ' + (i + 1) + '.', end((txt || li).textContent)];
      if (dur) lines.push('This step takes ' + end(ownText(dur)));
      add('Step ' + (i + 1), String(i + 1), lines, [li]);
    });

    // 6-8. Fix It, Good to know, Allergy note
    var fix = app.querySelector('.note.fix');
    if (fix) add('Fix It', 'Fix It', ['Fix it.'].concat(Array.prototype.map.call(fix.querySelectorAll('li'), function(li){ return end(li.textContent); })), [fix]);
    var good = app.querySelector('.note:not(.fix):not(.allergy)');
    if (good) add('Good to know', 'Good', [good.textContent], [good]);
    var allergy = app.querySelector('.note.allergy');
    if (allergy) add('Allergy note', 'Allergy', [allergy.textContent], [allergy]);
    return out;
  }

  function fmtT(sec){ sec = Math.max(0, Math.round(sec)); var m = Math.floor(sec / 60), s2 = sec % 60; return m + ':' + (s2 < 10 ? '0' : '') + s2; }

  function startSpeaker(r, viewFn){
    var synth = window.speechSynthesis;
    if (!synth || typeof SpeechSynthesisUtterance === 'undefined') { toast('Sorry, this browser cannot read out loud.'); return; }
    var sections = buildSections(r, viewFn);
    var total = sections.reduce(function(a, x){ return a + x.chars; }, 0);
    var S = speaker = { idx: 0, sent: 0, playing: false, gen: 0, sentStart: 0, sections: sections };

    var bar = document.createElement('div'); bar.className = 'player t-' + r.theme; bar.setAttribute('role', 'region'); bar.setAttribute('aria-label', 'Speaker mode');
    bar.innerHTML = '<div class="inner"><div class="row1"><div class="now"><b></b><span></span></div>' +
      '<div class="ctrls"><button data-p="prev" title="Previous section" aria-label="Previous section">⏮</button>' +
      '<button class="play" data-p="play" title="Play or pause" aria-label="Play or pause">⏸</button>' +
      '<button data-p="next" title="Next section" aria-label="Next section">⏭</button>' +
      '<button data-p="close" title="Turn off speaker mode" aria-label="Turn off speaker mode">✕</button></div></div>' +
      '<div class="tbar">' + sections.map(function(x, i){ return '<button class="seg2" data-i="' + i + '" style="flex-grow:' + x.chars + '" title="' + x.title + '" aria-label="Skip to ' + x.title + '"><span class="fill"></span></button>'; }).join('') + '</div>' +
      '<div class="tlabels"><span class="el">0:00</span><span class="tt">' + fmtT(total / CPS) + '</span></div></div>';
    document.body.appendChild(bar); document.body.classList.add('has-player');
    var spkBtn = app.querySelector('.spk'); if (spkBtn) { spkBtn.classList.add('on'); spkBtn.textContent = '🔇 Speaker off'; }
    S.bar = bar;

    function before(i){ var c = 0; for (var k = 0; k < i; k++) c += sections[k].chars; return c; }
    function posInSection(){
      var sec = sections[S.idx]; if (!sec) return 0;
      var c = 0; for (var k = 0; k < S.sent && k < sec.sents.length; k++) c += sec.sents[k].length + 1;
      if (S.playing && S.sent < sec.sents.length) c += Math.min(sec.sents[S.sent].length, (Date.now() - S.sentStart) / 1000 * CPS);
      return Math.min(c, sec.chars);
    }
    function paint(){
      var sec = sections[S.idx] || sections[sections.length - 1];
      bar.querySelector('.now b').textContent = S.done ? 'Finished!' : sec.title;
      bar.querySelector('.now span').textContent = S.done ? 'Press ⏮ or tap the bar to hear a part again.' : 'Part ' + (S.idx + 1) + ' of ' + sections.length;
      bar.querySelector('[data-p="play"]').textContent = S.playing ? '⏸' : '▶';
      bar.querySelector('[data-p="prev"]').disabled = S.idx === 0 && !S.done;
      bar.querySelector('[data-p="next"]').disabled = S.done || S.idx >= sections.length - 1;
      var inSec = posInSection();
      bar.querySelectorAll('.seg2').forEach(function(b, i){
        var pct = S.done || i < S.idx ? 100 : i > S.idx ? 0 : inSec / sections[i].chars * 100;
        b.querySelector('.fill').style.width = pct + '%';
        b.classList.toggle('cur', i === S.idx && !S.done);
      });
      var pos = S.done ? total : before(S.idx) + inSec;
      bar.querySelector('.el').textContent = fmtT(pos / CPS);
    }
    function highlight(scroll){
      app.querySelectorAll('.speaking').forEach(function(x){ x.classList.remove('speaking'); });
      if (S.done) return;
      var sec = sections[S.idx];
      sec.els.forEach(function(x){ x.classList.add('speaking'); });
      if (scroll && sec.els[0]) sec.els[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    function speakNow(){
      var g = ++S.gen;
      synth.cancel();
      if (!S.playing) { paint(); return; }
      var sec = sections[S.idx];
      if (S.sent >= sec.sents.length) {
        if (S.idx < sections.length - 1) { S.idx++; S.sent = 0; if (sections[S.idx].rebuild) { sections[S.idx].sents = [].concat.apply([], sections[S.idx].rebuild().map(sentences)); } highlight(true); }
        else { S.playing = false; S.done = true; highlight(false); paint(); return; }
        sec = sections[S.idx];
      }
      setTimeout(function(){
        if (g !== S.gen || !S.playing) return;
        var u = new SpeechSynthesisUtterance(sec.sents[S.sent]);
        u.lang = 'en-US'; u.rate = 0.95;
        u.onend = function(){ if (g !== S.gen) return; S.sent++; speakNow(); };
        u.onerror = function(e){ if (g !== S.gen) return; if (e && (e.error === 'interrupted' || e.error === 'canceled')) return; S.sent++; speakNow(); };
        S.sentStart = Date.now();
        synth.speak(u);
        paint();
      }, 80);
    }
    function jump(i){
      S.done = false; S.idx = Math.max(0, Math.min(sections.length - 1, i)); S.sent = 0;
      if (sections[S.idx].rebuild) sections[S.idx].sents = [].concat.apply([], sections[S.idx].rebuild().map(sentences));
      S.playing = true; highlight(true); speakNow();
    }
    S.jump = jump;
    bar.onclick = function(e){
      var seg = e.target.closest('.seg2'); if (seg) { jump(+seg.dataset.i); return; }
      var b = e.target.closest('[data-p]'); if (!b) return;
      var p = b.dataset.p;
      if (p === 'close') stopSpeaker();
      else if (p === 'next') jump(S.idx + 1);
      else if (p === 'prev') jump(S.done ? sections.length - 1 : S.idx - 1);
      else if (p === 'play') {
        if (S.done) { jump(0); return; }
        S.playing = !S.playing;
        if (S.playing) { highlight(false); speakNow(); } else { S.gen++; synth.cancel(); paint(); }
      }
    };
    S.iv = setInterval(function(){ if (S.playing) paint(); }, 250);
    jump(0);
  }
  function stopSpeaker(){
    if (!speaker) return;
    var S = speaker; speaker = null;
    S.gen++; S.playing = false; clearInterval(S.iv);
    try { window.speechSynthesis.cancel(); } catch(e){}
    if (S.bar) S.bar.remove();
    document.body.classList.remove('has-player');
    document.querySelectorAll('.speaking').forEach(function(x){ x.classList.remove('speaking'); });
    var spkBtn = app.querySelector('.spk'); if (spkBtn) { spkBtn.classList.remove('on'); spkBtn.textContent = '🔊 Speaker mode'; }
  }
  function route(){
    stopSpeaker();
    Object.keys(timers).forEach(function(k){ clearInterval(timers[k].iv); clearInterval(timers[k].ringIv); delete timers[k]; });
    var id = location.hash.replace('#', '');
    var r = visible().filter(function(x){ return x.id === id; })[0];
    if (r) recipe(r); else home();
    window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  // Premium bought or turned off (here or in another tab): show or hide the Premium recipes
  window.addEventListener('arcade-premium-change', route);
  window.addEventListener('storage', function(e){ if (e.key === 'squarebox:premiumUntil') route(); });
  route();
})();
</script>
